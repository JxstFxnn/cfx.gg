<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cfx.gg Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:transparent;min-height:100vh;font-family:'DM Sans',sans-serif;user-select:none;overflow:hidden;}
:root{--accent:#ff3daf;--ag:rgba(255,61,175,.65);--ad:rgba(255,61,175,.16);--ab:rgba(255,61,175,.3);--as2:rgba(255,61,175,.5);--af:rgba(255,61,175,.4);--sel:rgba(255,61,175,.12);--hb:rgba(255,61,175,.1);--hl:rgba(255,61,175,.35);}
body.t-pink  {--accent:#ff3daf;--ag:rgba(255,61,175,.65);--ad:rgba(255,61,175,.16);--ab:rgba(255,61,175,.3);--as2:rgba(255,61,175,.5);--af:rgba(255,61,175,.4);--sel:rgba(255,61,175,.12);--hb:rgba(255,61,175,.1);--hl:rgba(255,61,175,.35);}
body.t-grey  {--accent:#9090b0;--ag:rgba(144,144,176,.6);--ad:rgba(144,144,176,.14);--ab:rgba(144,144,176,.26);--as2:rgba(144,144,176,.5);--af:rgba(144,144,176,.38);--sel:rgba(144,144,176,.11);--hb:rgba(144,144,176,.08);--hl:rgba(144,144,176,.28);}
body.t-yellow{--accent:#f5c400;--ag:rgba(245,196,0,.65);--ad:rgba(245,196,0,.14);--ab:rgba(245,196,0,.3);--as2:rgba(245,196,0,.5);--af:rgba(245,196,0,.4);--sel:rgba(245,196,0,.1);--hb:rgba(245,196,0,.08);--hl:rgba(245,196,0,.32);}
body.t-cyan  {--accent:#00e5d4;--ag:rgba(0,229,212,.65);--ad:rgba(0,229,212,.14);--ab:rgba(0,229,212,.28);--as2:rgba(0,229,212,.5);--af:rgba(0,229,212,.38);--sel:rgba(0,229,212,.09);--hb:rgba(0,229,212,.08);--hl:rgba(0,229,212,.28);}
body.t-red   {--accent:#cc1010;--ag:rgba(204,16,16,.7);--ad:rgba(204,16,16,.18);--ab:rgba(204,16,16,.32);--as2:rgba(204,16,16,.55);--af:rgba(204,16,16,.44);--sel:rgba(204,16,16,.15);--hb:rgba(204,16,16,.12);--hl:rgba(204,16,16,.38);}
body.t-green {--accent:#39ff14;--ag:rgba(57,255,20,.65);--ad:rgba(57,255,20,.13);--ab:rgba(57,255,20,.28);--as2:rgba(57,255,20,.5);--af:rgba(57,255,20,.38);--sel:rgba(57,255,20,.09);--hb:rgba(57,255,20,.07);--hl:rgba(57,255,20,.28);}
body.t-blue  {--accent:#3d9fff;--ag:rgba(61,159,255,.65);--ad:rgba(61,159,255,.14);--ab:rgba(61,159,255,.28);--as2:rgba(61,159,255,.5);--af:rgba(61,159,255,.38);--sel:rgba(61,159,255,.1);--hb:rgba(61,159,255,.08);--hl:rgba(61,159,255,.28);}
body{display:flex;align-items:center;justify-content:flex-end;padding-right:24px;}
#menu{width:292px;background:#0d0d16;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.055),0 2px 0 0 var(--accent),0 30px 80px rgba(0,0,0,.97);overflow:hidden;position:relative;}
#menu::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px var(--ag);border-radius:50%;z-index:10;}
.banner{position:relative;height:91px;overflow:hidden;background:#09090f;}
.banner-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;opacity:.92;position:relative;z-index:2;}
.banner-fallback{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:32px;font-weight:800;letter-spacing:6px;color:transparent;-webkit-text-stroke:1.5px var(--accent);animation:bglow 3s ease-in-out infinite;}
@keyframes bglow{0%,100%{filter:drop-shadow(0 0 10px var(--ag));}50%{filter:drop-shadow(0 0 24px var(--ag));}}
.banner-overlay{position:absolute;inset:0;z-index:3;background:linear-gradient(to bottom,transparent 45%,rgba(13,13,22,.85) 100%);}
.banner-radial{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 100% 80% at 50% 0%,var(--hb) 0%,transparent 70%);}
.breadcrumb{background:#0d0d16;padding:6px 13px 7px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:6px;min-height:30px;}
.bc-icon{font-size:10px;color:var(--accent);opacity:.7;flex-shrink:0;}
.bc-text{font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.28);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bc-count{font-size:8.5px;color:rgba(255,255,255,.16);font-family:monospace;flex-shrink:0;}
#otabs{display:none;background:#0a0a12;border-bottom:1px solid rgba(255,255,255,.04);}
#otabs.vis{display:flex;}
.ot{flex:1;height:31px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:8.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.2);border-bottom:2px solid transparent;transition:all .15s;cursor:pointer;}
.ot i{font-size:8px;}
.ot.act{color:#fff;border-bottom-color:var(--accent);text-shadow:0 0 8px var(--ag);}
.cnt{overflow-y:auto;max-height:370px;scrollbar-width:thin;scrollbar-color:var(--af) transparent;}
.cnt::-webkit-scrollbar{width:2px;}.cnt::-webkit-scrollbar-thumb{background:var(--af);border-radius:2px;}
.item{display:flex;align-items:center;padding:0 13px;height:35px;border-bottom:1px solid rgba(255,255,255,.022);gap:9px;cursor:pointer;transition:background .1s;position:relative;}
.item:hover{background:rgba(255,255,255,.022);}
.item.sel{background:var(--sel);}
.item.sel::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;background:var(--accent);border-radius:0 2px 2px 0;box-shadow:0 0 8px var(--ag);}
.ii{width:15px;text-align:center;font-size:10px;flex-shrink:0;color:rgba(255,255,255,.16);transition:color .12s;}
.item.sel .ii{color:var(--accent);filter:drop-shadow(0 0 4px var(--ag));}
.in{font-size:12px;font-weight:400;color:#a0a0bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;transition:color .12s;text-align:left;}
.item.sel .in{color:#fff;font-weight:500;}
.tgl{width:30px;height:15px;background:#191927;border-radius:8px;position:relative;border:1px solid rgba(255,255,255,.055);flex-shrink:0;transition:background .2s,border-color .2s;}
.tgl::after{content:'';position:absolute;width:11px;height:11px;background:#2a2a40;border-radius:50%;top:1px;left:1px;transition:left .2s,background .2s,box-shadow .2s;}
.tgl.on{background:var(--ad);border-color:var(--ab);}
.tgl.on::after{left:16px;background:var(--accent);box-shadow:0 0 7px var(--ag);}
.ar{font-size:9px;color:rgba(255,255,255,.18);flex-shrink:0;transition:color .12s,transform .12s;}
.item.sel .ar{color:rgba(255,255,255,.45);}
.item.sel:hover .ar{transform:translateX(2px);}
.srow{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sv{font-size:9.5px;color:#4a4a62;min-width:26px;text-align:right;transition:color .12s;}
.item.sel .sv{color:var(--accent);}
.str{width:60px;height:2.5px;background:#1c1c2c;border-radius:2px;position:relative;flex-shrink:0;}
.sf{height:100%;background:linear-gradient(90deg,var(--ad),var(--accent));border-radius:2px;}
.sth{position:absolute;width:10px;height:10px;background:var(--accent);border-radius:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--ag);}
.iv{font-size:10px;color:#333348;font-weight:300;flex-shrink:0;white-space:nowrap;transition:color .12s;}
.iv .ca{color:#28283c;font-size:9px;}
.item.sel .iv{color:#888;}.item.sel .iv .ca{color:#555;}
.fp-icon{font-size:9px;color:rgba(255,255,255,.18);flex-shrink:0;transition:color .12s;}
.item.sel .fp-icon{color:var(--accent);}
.cv-val{font-size:10px;color:rgba(255,255,255,.3);flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:2px 7px;white-space:nowrap;max-width:115px;overflow:hidden;text-overflow:ellipsis;transition:color .12s,border-color .12s;}
.item.sel .cv-val{color:var(--accent);border-color:var(--ab);background:var(--ad);}
.pc{width:15px;height:15px;border-radius:50%;flex-shrink:0;border:1.5px solid #1c1c30;background:#10101e;display:flex;align-items:center;justify-content:center;transition:all .14s;}
.pc.chk{border-color:var(--accent);background:var(--ad);box-shadow:0 0 7px var(--ag);}
.pc.chk::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);display:block;}
.sep{display:flex;align-items:center;gap:8px;padding:7px 13px 3px;font-size:7.5px;font-weight:600;letter-spacing:2.5px;color:var(--as2);text-transform:uppercase;}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--ad);}
.footer{background:#090910;border-top:1px solid rgba(255,255,255,.035);padding:4px 11px;display:flex;align-items:center;min-height:24px;}
.footer-l{display:flex;align-items:center;gap:6px;}
.footer-logo{width:11px;height:11px;fill:var(--accent);opacity:.4;}
.footer-brand{font-size:8.5px;color:rgba(255,255,255,.18);}
.footer-brand span{color:var(--af);}
.footer-nav{display:flex;gap:8px;font-size:8px;color:rgba(255,255,255,.13);margin-left:auto;}
.footer-nav span{display:flex;align-items:center;gap:2px;}
.footer-nav i{font-size:7.5px;}

/* ── NOTIFICATIONS (clean redesign) ── */
#nc{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column-reverse;gap:6px;z-index:9999;pointer-events:none;width:210px;}
.notify{
  background:#0b0b16;
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  padding:9px 11px 9px 11px;
  display:flex;align-items:center;gap:9px;
  animation:nIn .2s cubic-bezier(.22,1,.36,1);
  overflow:hidden;position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.85);
}
@keyframes nIn{from{transform:translateX(12px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.n-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 6px var(--ag);}
.n-body{display:flex;flex-direction:column;flex:1;min-width:0;}
.n-title{font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.n-msg{font-size:9px;color:rgba(255,255,255,.4);margin-top:1px;}

/* ── KEY PICKER ── */
#kpo{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px;pointer-events:all;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);}
#kpo.hidden{display:none;}
.kpb{display:flex;flex-direction:column;align-items:center;gap:13px;background:#0a0a14;border:1px solid rgba(255,255,255,.08);border-top:2px solid var(--accent);border-radius:10px;padding:20px 38px 18px;box-shadow:0 20px 60px rgba(0,0,0,.97);animation:kpI .28s cubic-bezier(.22,1,.36,1);min-width:225px;text-align:center;}
@keyframes kpI{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.kpt{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.22);}
.kpw{font-size:10.5px;color:rgba(255,255,255,.14);animation:blk 1.4s ease-in-out infinite;}
@keyframes blk{0%,100%{opacity:.14;}50%{opacity:.42;}}
.kpp{background:#0e0e1e;border:1px solid rgba(255,255,255,.11);border-bottom:3px solid var(--accent);border-radius:7px;padding:5px 20px;font-size:19px;font-weight:700;letter-spacing:2px;color:var(--accent);font-family:'Syne',sans-serif;box-shadow:0 0 20px var(--ad);min-width:56px;animation:kpP .16s cubic-bezier(.22,1,.36,1);}
@keyframes kpP{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.kpc{font-size:8.5px;color:rgba(255,255,255,.18);}
.kpc span{color:var(--accent);font-weight:600;}
.skip-btn{margin-top:2px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:4px 14px;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.2);cursor:pointer;font-family:inherit;transition:all .15s;}
.skip-btn:hover{color:rgba(255,255,255,.45);background:rgba(255,255,255,.06);}
#kbpo{position:fixed;inset:0;z-index:9997;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);}
#kbpo.vis{display:flex;}
</style>
</head>

let stack=[{menu:'Main',idx:0}];
function cur(){return stack[stack.length-1];}

// ── HELPERS ──
function notify(title,msg){
  const nc=document.getElementById('nc'),n=document.createElement('div');
  n.className='notify';
  n.innerHTML=`<div class="n-dot"></div><div class="n-body"><div class="n-title">${title}</div>${msg?`<div class="n-msg">${msg}</div>`:''}</div>`;
  nc.appendChild(n);
  setTimeout(()=>n.remove(),3000);
}

function applyTheme(t){
  currentTheme=t;
  document.body.className=THEME_CLASSES[t]||'t-pink';
  updateBanner();
}

function updateBanner(){
  const f=THEME_BANNERS[currentTheme];
  document.getElementById('banner-content').innerHTML=`<img class="banner-img" src="${f}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="banner-fallback" style="display:none">cfx.gg</div>`;
}

// ── MENU LOGIC ──
function openMenu(){
  menuVisible=true;
  document.getElementById('menu').style.display='';
  document.getElementById('kpo').classList.add('hidden');
  render();
}

function closeMenu(){
  menuVisible=false;
  document.getElementById('menu').style.display='none';
}

function visItems(){
  const m=MENUS[cur().menu]||[];
  return m.filter(i=>i.type!=='slider');
}

function makeKey(item){
  return cur().menu+'||'+item.name;
}

function activate(item,dir){
  if(!item)return;
  const k=makeKey(item);
  if(item.type==='toggle'){
    toggleState[k]=!toggleState[k];
    render();
  }else if(item.type==='button'){
    // button action
  }else if(item.type==='sub'){
    stack.push({menu:item.child,idx:0});
    render();
  }else if(item.type==='online'){
    onlineMode=true;
    onlineTab=-1;
    onlineItemIdx=0;
    renderOnline();
  }
}

function adjSl(item,dir){
  const all=MENUS[cur().menu]||[];
  const sl=all.find(x=>x.type==='slider'&&x.name===item.name);
  if(!sl)return;
  sl.val=Math.max(sl.min,Math.min(sl.max,sl.val+dir*sl.step));
}

function cycleVal(item,dir){
  if(!item.actions)return;
  const idx=item.actions.indexOf(item.val);
  let nidx=idx+dir;
  if(nidx<0)nidx=item.actions.length-1;
  if(nidx>=item.actions.length)nidx=0;
  item.val=item.actions[nidx];
}

function render(){
  const cnt=document.getElementById('cnt');
  const vis=visItems();
  const all=MENUS[cur().menu]||[];
  const bc=document.getElementById('bc-t');
  const bcc=document.getElementById('bc-c');
  bc.textContent=cur().menu.toUpperCase().replace(/([A-Z])/g,' $1').trim();
  bcc.textContent=vis.length;
  document.getElementById('otabs').classList.remove('vis');

  let html='';
  vis.forEach((item,i)=>{
    const sel=i===cur().idx?'sel':'';
    if(item.type==='sep'){
      html+=`<div class="sep">${item.label}</div>`;
      return;
    }
    const k=makeKey(item);
    const on=toggleState[k]||false;
    const icon=item.icon||'circle';
    let right='';
    if(item.type==='toggle'){
      right=`<div class="tgl ${on?'on':''}"></div>`;
    }else if(item.type==='sub'||item.type==='online'){
      right='<i class="ar fa-solid fa-chevron-right"></i>';
    }else if(item.type==='button'){
      const kb=keybinds[item.name];
      if(kb)right=`<span class="fp-icon">${kb}</span>`;
      else right='<i class="fa-solid fa-play fp-icon"></i>';
    }else if(item.type==='slider'){
      const slider=all.find(x=>x.type==='slider'&&x.name===item.name);
      if(slider){
        const pct=((slider.val-slider.min)/(slider.max-slider.min)*100).toFixed(0);
        right=`<div class="srow"><span class="sv">${slider.val}</span><div class="str"><div class="sf" style="width:${pct}%"></div><div class="sth" style="left:${pct}%"></div></div></div>`;
      }
    }
    html+=`<div class="item ${sel}"><i class="ii fa-solid fa-${icon}"></i><div class="in">${item.name}</div>${right}</div>`;
  });
  cnt.innerHTML=html;
}

// ── ONLINE MODE ──
function renderOnline(){
  const tabs=document.getElementById('otabs');
  tabs.classList.add('vis');
  tabs.querySelectorAll('.ot').forEach((t,i)=>{
    if(parseInt(t.dataset.tab)===onlineTab)t.classList.add('act');
    else t.classList.remove('act');
  });

  const cnt=document.getElementById('cnt');
  const isList=onlineTab===-1;
  const vis=isList?ONLINE_PLAYERS:ONLINE_TABS[OTN[onlineTab]].filter(i=>i.type!=='sep');

  let html='';
  if(isList){
    if(!vis.length){
      html='<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:11px;">No players</div>';
    }else{
      vis.forEach((p,i)=>{
        const sel=i===onlineItemIdx?'sel':'';
        const nm=p.name||'Unknown';
        const ic=p.me?'user-check':'user';
        html+=`<div class="item ${sel}"><i class="ii fa-solid fa-${ic}"></i><div class="in">${nm}</div></div>`;
      });
    }
  }else{
    vis.forEach((item,i)=>{
      const sel=i===onlineItemIdx?'sel':'';
      html+=`<div class="item ${sel}"><i class="ii fa-solid fa-${item.icon}"></i><div class="in">${item.name}</div></div>`;
    });
  }
  cnt.innerHTML=html;
}

function activateOnlineItem(){
  const isList=onlineTab===-1;
  if(isList){
    const p=ONLINE_PLAYERS[onlineItemIdx];
    if(p){
      onlineTab=0;
      onlineItemIdx=0;
      renderOnline();
    }
  }else{
    const vis=ONLINE_TABS[OTN[onlineTab]].filter(i=>i.type!=='sep');
    const item=vis[onlineItemIdx];
    if(item){
      // execute online action
    }
  }
}

// ── KEYBIND PICKER ──
function kpShowKey(key){
  kpPending=key;
  const box=document.querySelector('#kpo .kpb');
  const old=box.querySelector('.kpp');
  if(old)old.remove();
  const pill=document.createElement('span');
  pill.className='kpp';
  pill.textContent=key;
  const cf=document.getElementById('kpcf');
  box.insertBefore(pill,cf);
  document.getElementById('kpw').style.display='none';
  document.getElementById('kpkd').textContent=key;
  cf.style.display='';
  kpState='confirm';
}

function kpConfirm(){
  menuHotkey=kpPending;
  kpState='done';
  document.getElementById('kpo').classList.add('hidden');
  notify('Hotkey set',menuHotkey+' opens/closes menu');
  openMenu();
}

function kpReset(){
  kpState='waiting';
  kpPending=null;
  const old=document.querySelector('#kpo .kpb .kpp');
  if(old)old.remove();
  document.getElementById('kpw').style.display='';
  document.getElementById('kpcf').style.display='none';
}

function openKbPicker(item){
  kbMode=true;
  kbPending={item,key:null};
  document.getElementById('kbpn').textContent=item.name;
  document.getElementById('kbpw').style.display='';
  document.getElementById('kbpcf').style.display='none';
  const old=document.getElementById('kbpb').querySelector('.kpp');
  if(old)old.remove();
  document.getElementById('kbpo').classList.add('vis');
}

function closeKbPicker(){
  kbMode=false;
  kbPending=null;
  document.getElementById('kbpo').classList.remove('vis');
}

function confirmKbPicker(){
  if(!kbPending?.key)return;
  keybinds[kbPending.item.name]=kbPending.key;
  closeKbPicker();
  notify('Keybind',kbPending.item.name+' → '+kbPending.key);
  render();
}

// ── HANDLE KEY ──
function handleKey(key){
  // KEYBIND PICKER FLOW
  if(kpState!=='done'){
    if(KB_SKIP.has(key))return;
    if(kpState==='confirm'){
      if(key==='Enter'){kpConfirm();return;}
      if(key==='Escape'||key==='Backspace'){kpReset();return;}
      kpShowKey(key);
      return;
    }
    kpShowKey(key);
    return;
  }

  // ITEM KEYBIND PICKER
  if(kbMode){
    if(key==='Escape'){closeKbPicker();return;}
    if(key==='Backspace'){
      if(kbPending?.item)delete keybinds[kbPending.item.name];
      closeKbPicker();
      render();
      return;
    }
    if(key==='Enter'){confirmKbPicker();return;}
    if(KB_SKIP.has(key))return;
    kbPending.key=key;
    const box=document.getElementById('kbpb'),old=box.querySelector('.kpp');
    if(old)old.remove();
    const pill=document.createElement('span');pill.className='kpp';pill.textContent=key;
    box.insertBefore(pill,document.getElementById('kbpcf'));
    document.getElementById('kbpw').style.display='none';
    document.getElementById('kbpkd').textContent=key;
    document.getElementById('kbpcf').style.display='';
    return;
  }

  // MENU HOTKEY TOGGLE
  if(menuHotkey&&key===menuHotkey){
    if(menuVisible)closeMenu();
    else openMenu();
    return;
  }

  if(!menuVisible)return;

  // ONLINE MODE
  if(onlineMode){
    const isL=onlineTab===-1;
    const vis=isL?ONLINE_PLAYERS:ONLINE_TABS[OTN[onlineTab]].filter(i=>i.type!=='sep');
    if(key==='ArrowDown'){onlineItemIdx=Math.min(onlineItemIdx+1,vis.length-1);renderOnline();}
    else if(key==='ArrowUp'){onlineItemIdx=Math.max(onlineItemIdx-1,0);renderOnline();}
    else if(key==='Enter'||key==='ArrowRight'){activateOnlineItem();}
    else if(key==='q'||key==='Q'||key==='TabLeft'){onlineTab=(onlineTab===-1)?2:((onlineTab-1+3)%3);onlineItemIdx=0;renderOnline();}
    else if(key==='e'||key==='E'||key==='TabRight'){onlineTab=(onlineTab===2)?-1:((onlineTab+1)%3);onlineItemIdx=0;renderOnline();}
    else if(key==='ArrowLeft'||key==='Backspace'){
      if(!isL){onlineTab=-1;onlineItemIdx=0;renderOnline();}
      else{onlineMode=false;render();}
    }
    return;
  }

  // NORMAL MENU
  const vis=visItems();
  const st=cur();
  const item=vis[st.idx];

  if(key==='F6'&&item&&item.type!=='sep'&&item.type!=='sub'&&item.type!=='online'){
    openKbPicker(item);
    return;
  }

  if(key==='ArrowDown'){cur().idx=Math.min(st.idx+1,vis.length-1);render();}
  else if(key==='ArrowUp'){cur().idx=Math.max(st.idx-1,0);render();}
  else if(key==='Enter'||key==='ArrowRight'){activate(item,1);}
  else if(key==='ArrowLeft'){
    if(item?.type==='slider'){adjSl(item,-1);render();}
    else if(stack.length>1){stack.pop();render();}
  }
  else if(key==='Backspace'){
    if(stack.length>1){stack.pop();render();}
    else closeMenu();
  }
}
}

// ── LUA DUI MESSAGES ──
window.addEventListener('message',ev=>{
  const d=ev.data;
  if(!d?.type)return;

  if(d.type==='control'){
    handleKey(d.key);
    return;
  }

  if(d.type==='notify'){
    notify(d.title||'',d.msg||'');
    return;
  }

  if(d.type==='updatePlayers'){
    ONLINE_PLAYERS=d.players||[];
    if(onlineMode&&onlineTab===-1)renderOnline();
    return;
  }

  if(d.type==='luaOpen'){
    // Lua tells us to skip key picker and open menu
    kpState='done';
    openMenu();
    return;
  }

  if(d.type==='luaClose'){
    closeMenu();
    return;
  }
});

updateBanner();
document.getElementById('skip-kp').addEventListener('click',()=>{
  menuHotkey='F4';
  kpState='done';
  document.getElementById('kpo').classList.add('hidden');
  notify('Hotkey','F4 opens/closes menu');
  openMenu();
});

document.getElementById('kpo').classList.remove('hidden');
