<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>cfx.gg Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:transparent!important;}
:root{--accent:#ff3daf;--accent-glow:rgba(255,20,147,0.7);--accent-dim:rgba(255,20,147,0.2);--accent-border:rgba(255,20,147,0.28);--accent-sep:rgba(255,20,147,0.45);--accent-fill:rgba(255,20,147,0.4);--sel-bg:rgba(255,20,145,0.41);--hbg-color:rgba(255,20,147,0.2);--hline-color:rgba(255,20,147,0.4);}
body.theme-grey{--accent:#8a8aaa;--accent-glow:rgba(138,138,170,0.7);--accent-dim:rgba(138,138,170,0.15);--accent-border:rgba(138,138,170,0.25);--accent-sep:rgba(138,138,170,0.45);--accent-fill:rgba(138,138,170,0.4);--sel-bg:rgba(138,138,170,0.3);--hbg-color:rgba(138,138,170,0.15);--hline-color:rgba(138,138,170,0.4);}
body.theme-yellow{--accent:#ffd400;--accent-glow:rgba(255,212,0,0.65);--accent-dim:rgba(255,212,0,0.18);--accent-border:rgba(255,200,0,0.35);--accent-sep:rgba(255,190,0,0.55);--accent-fill:rgba(255,204,0,0.60);--sel-bg:rgba(255,215,0,0.40);--hbg-color:rgba(255,210,0,0.22);--hline-color:rgba(255,200,0,0.50);}
body{display:flex;justify-content:flex-end;align-items:center;min-height:100vh;padding-right:24px;font-family:'Inter',sans-serif;user-select:none;pointer-events:none;}
#notify-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none;min-width:240px;}
.notify{background:#0a0a12;border:1px solid rgba(255,255,255,0.09);border-left:2px solid var(--accent);padding:10px 16px 14px;border-radius:4px;min-width:240px;display:flex;flex-direction:column;animation:notifyIn .25s cubic-bezier(.22,1,.36,1);overflow:hidden;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.9);}
@keyframes notifyIn{from{transform:translateY(-14px) scale(.97);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.notify-header{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:#fff;}
.notify-header i{color:var(--accent);font-size:11px;}
.notify-msg{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:3px;padding-left:19px;}
.notify-bar{height:2px;background:var(--accent);position:absolute;bottom:0;left:0;width:100%;box-shadow:0 0 6px var(--accent-glow);}
#watermark{display:none;position:fixed;top:0;left:0;z-index:200;background:#0a0a12;border-right:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);border-radius:0 0 4px 0;}
#watermark.open{display:block;}
.wm-bar{display:flex;align-items:center;height:22px;padding:0 10px 0 8px;}
.wm-seg{display:flex;align-items:center;gap:6px;padding:0 8px;height:100%;border-right:1px solid rgba(255,255,255,.04);white-space:nowrap;flex-shrink:0;}
.wm-seg:last-child,.wm-seg.push{border-right:none;}
.wm-seg.push{margin-left:auto;border-left:1px solid rgba(255,255,255,.04);}
.wm-icon{width:11px;height:11px;fill:var(--accent);opacity:.8;}
.wm-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:lowercase;color:var(--accent);}
.wm-val{font-size:9.5px;color:rgba(255,255,255,.42);}
.wm-val.dim{color:rgba(255,255,255,.2);}.wm-val.green{color:#3dff8a;}
.wm-time-val{font-size:9.5px;color:rgba(255,255,255,.3);}
#spectator-list{display:none;position:fixed;top:14px;right:14px;width:160px;z-index:200;background:#0d0d15;border:1px solid rgba(255,255,255,.05);border-radius:3px;overflow:hidden;}
#spectator-list.open{display:block;}
.spec-title{padding:6px 12px 5px;font-size:8px;letter-spacing:2.5px;font-weight:600;color:var(--accent-sep);text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.04);background:#0b0b13;}
.spec-row{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:32px;border-bottom:1px solid rgba(255,255,255,.025);}
.spec-left{display:flex;align-items:center;gap:7px;}
.spec-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 4px var(--accent-glow);animation:specPulse 1.8s ease-in-out infinite;}
@keyframes specPulse{0%,100%{opacity:1}50%{opacity:.2}}
.spec-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;color:var(--accent);}
.spec-dist{font-size:9px;color:rgba(255,255,255,.28);font-family:monospace;}
#keybind-list{display:none;position:fixed;top:14px;left:14px;width:160px;z-index:200;background:#0d0d15;border:1px solid rgba(255,255,255,.05);border-radius:3px;overflow:hidden;}
#keybind-list.open{display:block;}
.kb-title{padding:6px 10px 5px;font-size:8px;letter-spacing:2.5px;font-weight:600;color:var(--accent-sep);text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.04);background:#0b0b13;}
.kb-item{padding:0 10px;height:30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.03);gap:6px;}
.kb-item-name{flex:1;font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kb-item-right{display:flex;align-items:center;gap:5px;}
.kb-status-on{font-size:8.5px;font-weight:600;color:#3dff8a;}
.kb-status-off{font-size:8.5px;font-weight:600;color:var(--accent);opacity:.5;}
.kb-key{background:#1c1c2a;border:1px solid rgba(255,255,255,.08);border-radius:2px;padding:1px 6px;font-size:9px;color:#aaa;font-family:monospace;}
.kb-empty{padding:12px 10px;font-size:9px;color:rgba(255,255,255,.15);text-align:center;}
#wrapper{position:relative;z-index:9990;}
#menu{width:285px;background:#0d0d15;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 25px 70px rgba(0,0,0,.95);overflow:hidden;}
.header{position:relative;overflow:hidden;background:#0f0f18;border-bottom:1px solid rgba(255,255,255,.05);}
.hbg{position:absolute;inset:0;background:radial-gradient(ellipse 130% 100% at 50% -5%,var(--hbg-color) 0%,transparent 60%);pointer-events:none;}
.banner-img{display:block;width:100%;height:90px;object-fit:cover;position:relative;z-index:1;}
.banner-fallback{display:none;width:100%;height:90px;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:38px;font-weight:700;letter-spacing:5px;text-transform:lowercase;color:transparent;-webkit-text-stroke:1.5px var(--accent);animation:glow 2.5s ease-in-out infinite;position:relative;z-index:1;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px var(--accent-glow));}50%{filter:drop-shadow(0 0 18px var(--accent-glow));}}
.breadcrumb{position:relative;padding:7px 0 10px;font-size:10px;color:rgba(255,255,255,.38);letter-spacing:1px;text-transform:uppercase;text-align:center;}
.hline{position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--hline-color) 50%,transparent);}
#online-tabs{display:none;background:#0b0b14;border-bottom:1px solid rgba(255,255,255,.04);padding:0 8px;}
#online-tabs.visible{display:flex;}
.otab{flex:1;height:30px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.25);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.otab.active{color:#fff;border-bottom-color:var(--accent);}
.content{overflow-y:auto;max-height:400px;scrollbar-width:thin;scrollbar-color:var(--accent-fill) transparent;}
.content::-webkit-scrollbar{width:3px;}
.content::-webkit-scrollbar-thumb{background:var(--accent-fill);border-radius:2px;}
.item{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:37px;border-bottom:1px solid rgba(255,255,255,.025);pointer-events:none;}
.item.selected{background:var(--sel-bg);}
.item.selected .iname{color:#fff;font-weight:500;}
.iname{font-size:12.5px;color:#b8b8c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;}
.toggle{width:32px;height:16px;background:#20202e;border-radius:8px;position:relative;border:1px solid rgba(255,255,255,.05);flex-shrink:0;transition:background .22s;}
.toggle::after{content:'';position:absolute;width:12px;height:12px;background:#353548;border-radius:50%;top:1px;left:1px;transition:left .22s,background .22s;}
.toggle.on{background:var(--accent-dim);border-color:var(--accent-border);}
.toggle.on::after{left:17px;background:var(--accent);box-shadow:0 0 7px var(--accent-glow);}
.srow{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sval{font-size:10px;color:#888;min-width:30px;text-align:right;}
.item.selected .sval{color:var(--accent);}
.slidertrack{width:72px;height:3px;background:#252535;border-radius:2px;position:relative;flex-shrink:0;}
.sliderfill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:2px;}
.sliderthumb{position:absolute;width:12px;height:12px;background:var(--accent);border-radius:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--accent-glow);}
.ival{font-size:11px;color:#484858;font-weight:300;flex-shrink:0;white-space:nowrap;}
.ival .ca{color:#444;font-size:10px;}
.item.selected .ival{color:#aaa;}
.item.selected .ival .ca{color:#777;}
.arr{font-size:12px;color:#444;flex-shrink:0;}
.item.selected .arr{color:#aaa;}
.fp{width:14px;height:14px;flex-shrink:0;opacity:.22;}
.item.selected .fp{opacity:.65;}
.plr-check{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1.5px solid #252540;background:#14142a;transition:all .18s;}
.plr-check.checked{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 8px var(--accent-glow);}
.plr-check.checked::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);display:block;margin:auto;margin-top:3px;}
.sep{display:flex;align-items:center;gap:10px;padding:9px 14px 4px;font-size:8.5px;font-weight:500;letter-spacing:2px;color:var(--accent-sep);text-transform:uppercase;}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--accent-dim);}
.footer-gap{height:5px;background:#07070e;}
.footer{background:#0a0a12;border-top:1px solid rgba(255,255,255,.04);padding:5px 10px 5px 8px;display:flex;justify-content:space-between;align-items:center;}
.footer-left{display:flex;align-items:center;gap:6px;}
.footer-icon{width:14px;height:14px;opacity:.4;fill:var(--accent);}
.fbrand{font-size:9px;color:rgba(255,255,255,.2);}
.fbrand span{color:var(--accent-fill);}
.fcnt{font-size:9px;color:#2a2a38;}
#keypick-overlay{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:48px;pointer-events:none;}
#keypick-overlay.hidden{display:none;}
.kp-box{display:flex;flex-direction:column;align-items:center;gap:12px;background:#08080f;border:1px solid rgba(255,255,255,.08);border-top:2px solid var(--accent);border-radius:6px;padding:20px 36px 18px;box-shadow:0 20px 60px rgba(0,0,0,.95);animation:kpIn .3s cubic-bezier(.22,1,.36,1);min-width:220px;text-align:center;}
@keyframes kpIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.kp-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);}
.kp-sub{font-size:10px;color:rgba(255,255,255,.15);}
.kp-waiting{font-size:11px;color:rgba(255,255,255,.18);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.18;}50%{opacity:.5;}}
.kp-pill{background:#0e0e1e;border:1px solid rgba(255,255,255,.14);border-bottom:3px solid rgba(255,255,255,.2);border-radius:5px;padding:6px 20px;font-size:18px;font-weight:700;color:var(--accent);font-family:'Rajdhani',sans-serif;min-width:60px;animation:pillIn .2s cubic-bezier(.22,1,.36,1);}
@keyframes pillIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.kp-confirm{font-size:9.5px;color:rgba(255,255,255,.22);}
.kp-confirm span{color:var(--accent);font-weight:600;}
#kbpick-overlay{position:fixed;inset:0;z-index:9997;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:48px;pointer-events:none;}
#kbpick-overlay.visible{display:flex;}
</style>
</head>

<script>
const t=(n)=>({type:'toggle',name:n});
const b=(n)=>({type:'button',name:n});
const s=(n,c)=>({type:'sub',name:n,children:{label:n,items:c}});
const sl=(n,val,mn,mx)=>({type:'slider',name:n,val:val,min:mn,max:mx});

    s('Misc Self',[t('Off Radar'),t('Ghost Organization'),t('Semi God'),t('Bullet Proof'),t('Fire Proof'),t('Explosion Proof'),t('Melee Proof')]),

    sp('Aimbot'),t('Enable Aimbot'),t('Visible Only'),t('Lock Bone Head'),t('Lock Bone Chest'),sl('Aimbot FOV',150,10,360),sl('Aimbot Smooth',5,1,20),
    sp('Silent Aim'),t('Enable Silent Aim'),t('Silent NPCs'),sl('Silent FOV',150,10,360),sl('Silent Distance',200,10,500),
    sp('Misc'),t('Fast Punch'),t('One Punch'),t('Super Punch'),t('No Punch Cooldown'),t('Instant Kill'),b('Kill Nearby NPCs'),b('Delete Nearby Vehicles'),
  ]),
  s('ESP / Visuals',[
    s('Player ESP',[t('Enable Player ESP'),t('Show Names'),t('Show Distance'),t('Show Health'),t('Show Weapon'),t('Box ESP'),t('Skeleton ESP'),t('Snaplines')]),
    s('Vehicle ESP',[t('Enable Vehicle ESP'),t('Show Names'),t('Show Distance'),t('Show Driver')]),
    s('NPC ESP',[t('Enable NPC ESP'),t('Show Names'),t('Show Distance')]),
    sp('UI'),t('Show Crosshair'),t('Speedometer'),t('Compass'),t('Show Watermark'),t('Show Clock'),vl('Theme','Default',['Default','Grey','Yellow']),
  ]),
  s('Misc Options',[
    s('Time & Weather',[t('Lock Time'),sl('Hour',12,0,23),t('Lock Weather'),vl('Weather','CLEAR',['EXTRASUNNY','CLEAR','CLOUDS','OVERCAST','RAIN','THUNDER','CLEARING','NEUTRAL','SNOW','BLIZZARD','SNOWLIGHT','XMAS','HALLOWEEN'])]),
    s('World',[b('Remove All NPCs'),b('Remove All Vehicles'),t('NPC Ignore Player'),t('No NPC Respawn'),t('Freeze World'),t('No Water'),sl('Field of View',70,40,120)]),
    s('Money / RP',[b('Money Drop'),b('RP Drop'),b('CEO Money'),sl('Money Amount',10000,1000,1000000)]),
    s('Trolling',[t('Hydra Rain'),t('Ufo Madness'),b('Spawn Explosion'),b('Spawn Hydra'),b('Spawn Rhino'),b('Send to Hospital')]),
    sp('Settings'),t('Spectator List'),t('Keybind List'),
    vl('Menu Scale','1.0',['0.8','0.9','1.0','1.1','1.2']),
    vl('Menu Position','Right',['Right','Left']),
  ]),
  s('Settings',[
    vl('Menu Hotkey','F4',['F1','F2','F3','F4','F5','F6','F7','F8','Insert','Delete','Home']),
    vl('Theme','Default',['Default','Grey','Yellow']),
    t('Blur Background'),sl('Menu Opacity',100,20,100),
    sp('Misc'),b('Reset Settings'),b('Save Config'),b('Load Config'),
  ]),
]};

const ONLINE_SAFE=[t('Spectate'),b('Teleport To Player'),b('Teleport To Me'),b('Bring Player'),b('Swap Position'),sp('Interact'),b('Copy Outfit'),b('Copy Weapons'),b('Drop Weapons'),b('Friend Request'),b('Message Player')];
const ONLINE_RISK=[b('Kill Player'),b('Explode Player'),b('Kick Player'),b('Crash Player'),b('Freeze Player'),t('Freeze Loop'),b('Cage Player'),b('Launch Player'),b('Set On Fire'),b('Spawn Attacker'),b('UFO Abduct'),b('Lightning Strike')];
const ONLINE_VEH=[b('Steal Vehicle'),b('Delete Vehicle'),b('Kick Driver'),b('Flip Vehicle'),b('Repair Vehicle'),b('Explode Vehicle'),t('Freeze Vehicle'),b('Launch Vehicle'),b('Max Mods Vehicle')];
const ONLINE_TABS={Safe:ONLINE_SAFE,Risk:ONLINE_RISK,Vehicle:ONLINE_VEH};
const OTN=['Safe','Risk','Vehicle'];

let stack=[{menu:MAIN,idx:0}];
let toggleState={};
let selectedPlrs=new Set();
let keybinds={};
let menuVisible=false;
let onlineMode=false,onlineTab=-1,onlineItemIdx=0;
let ONLINE_PLAYERS=[];
let MY_ID=null;
let kpState='waiting';
let kpPending=null;
let menuHotkey=null;
let kbMode=false;
let kbPending=null;
const KB_SKIP=new Set(['Shift','Control','Alt','Meta','CapsLock','Tab','Unidentified','']);

function cur(){return stack[stack.length-1];}
function visItems(){return cur().menu.items.filter(i=>i.type!=='sep');}
function makeKey(item){return stack.map(s=>s.menu.label).join('||')+'||'+item.name;}
function cycleVal(item,dir){const ci=item.actions.indexOf(item.val);item.val=item.actions[(ci+dir+item.actions.length)%item.actions.length];}
function sliderStep(i){return(i.max-i.min)<=2?0.1:1;}
function sliderPct(i){return((i.val-i.min)/(i.max-i.min))*100;}
function sliderFmt(i){return parseFloat(i.val).toFixed(sliderStep(i)<1?1:0);}
function adjSlider(item,dir){const s=sliderStep(item);item.val=Math.min(item.max,Math.max(item.min,+(item.val+dir*s).toFixed(10)));}

function notify(title,msg,icon){
  const c=document.getElementById('notify-container');
  while(c.children.length>=3)c.firstChild.remove();
  const n=document.createElement('div');n.className='notify';
  n.innerHTML=`<div class="notify-header"><i class="${icon||'fa-solid fa-bell'}"></i> ${title}</div><div class="notify-msg">${msg}</div><div class="notify-bar"></div>`;
  c.appendChild(n);
  const bar=n.querySelector('.notify-bar');
  requestAnimationFrame(()=>{bar.style.transition='width 3s linear';bar.style.width='0%';});
  setTimeout(()=>{n.style.transition='opacity .25s';n.style.opacity='0';setTimeout(()=>n.remove(),250);},3000);
}

function applyTheme(name){document.body.className=name==='Grey'?'theme-grey':name==='Yellow'?'theme-yellow':'';}

function renderOnline(){
  document.getElementById('online-tabs').classList.add('visible');
  document.getElementById('online-tabs').querySelectorAll('.otab').forEach(t=>t.classList.toggle('active',parseInt(t.dataset.tab)===onlineTab));
  const el=document.getElementById('content');
  const isL=onlineTab===-1;
  let html='';
  if(isL){
    document.getElementById('bc').textContent='Online Players';
    if(!ONLINE_PLAYERS.length){html='<div style="padding:20px;text-align:center;font-size:11px;color:rgba(255,255,255,0.2)">Keine Spieler online</div>';}
    else ONLINE_PLAYERS.forEach((p,i)=>{
      const sel=i===onlineItemIdx,chk=selectedPlrs.has(p.id);
      const ms=p.me?'style="color:var(--accent);font-weight:600"':'';
      const mt=p.me?' <span style="font-size:9px;color:var(--accent)">(me)</span>':'';
      html+=`<div class="item${sel?' selected':''}" ><span class="iname" ${ms}>[${p.id}] ${p.name}${mt}</span><div class="plr-check${chk?' checked':''}"></div></div>`;
    });
  }else{
    const tn=OTN[onlineTab];
    document.getElementById('bc').textContent='Online › '+tn;
    ONLINE_TABS[tn].filter(i=>i.type!=='sep').forEach((item,i)=>{
      const sel=i===onlineItemIdx;
      const k='online||'+tn+'||'+item.name;
      const on=toggleState[k]||false;
      let r=item.type==='toggle'?`<div class="toggle${on?' on':''}"></div>`:FP;
      html+=`<div class="item${sel?' selected':''}" ><span class="iname">${item.name}</span>${r}</div>`;
    });
  }
  el.innerHTML=html;
  document.getElementById('fcnt').textContent=isL?`${selectedPlrs.size}/${ONLINE_PLAYERS.length}`:OTN[onlineTab];
  el.querySelector('.item.selected')?.scrollIntoView({block:'nearest'});
}

function render(){
  if(!menuVisible)return;
  if(onlineMode){renderOnline();return;}
  document.getElementById('online-tabs').classList.remove('visible');
  const vis=visItems();const idx=cur().idx;
  document.getElementById('bc').textContent=stack.map(s=>s.menu.label).join(' › ');
  let html='';
  cur().menu.items.forEach((item,i)=>{
    if(item.type==='sep'){html+=`<div class="sep">${item.label||''}</div>`;return;}
    const mi=vis.indexOf(item);const sel=mi===idx;
    const k=makeKey(item);const on=toggleState[k]||false;
    let r='';
    if(item.type==='toggle')r=`<div class="toggle${on?' on':''}"></div>`;
    else if(item.type==='slider'){const p=sliderPct(item),d=sliderFmt(item);r=`<div class="srow"><span class="sval">${d}</span><div class="slidertrack"><div class="sliderfill" style="width:${p}%"></div><div class="sliderthumb" style="left:${p}%"></div></div></div>`;}
    else if(item.type==='value')r=item.actions?`<span class="ival"><span class="ca">‹ </span>${item.val}<span class="ca"> ›</span></span>`:`<span class="ival">${item.val}</span>`;
    else if(item.type==='sub'||item.type==='online')r=`<span class="arr">»</span>`;
    else if(item.type==='button')r=FP;
    html+=`<div class="item${sel?' selected':''}" ><span class="iname">${item.name}</span>${r}</div>`;
  });
  document.getElementById('content').innerHTML=html;
  document.getElementById('fcnt').textContent=`${Math.min(idx+1,vis.length)}/${vis.length}`;
  document.getElementById('content').querySelector('.item.selected')?.scrollIntoView({block:'nearest'});
}

function renderKeybindList(){
  const el=document.getElementById('kb-items');if(!el)return;
  const e=Object.entries(keybinds);
  if(!e.length){el.innerHTML='<div class="kb-empty">Keine Keybinds<br><span style="opacity:.5;font-size:8px">F6 auf Item</span></div>';return;}
  el.innerHTML=e.map(([name,key])=>{
    const mk=Object.keys(toggleState).find(k=>k.endsWith('||'+name));
    const on=mk&&toggleState[mk];
    const st=mk?(on?'<span class="kb-status-on">ON</span>':'<span class="kb-status-off">OFF</span>'):'';
    return`<div class="kb-item"><span class="kb-item-name">${name}</span><div class="kb-item-right">${st}<span class="kb-key">${key}</span></div></div>`;
  }).join('');
}

function activate(item,dir){
  if(!item)return;
  const k=makeKey(item);
  if(item.type==='toggle'){
    toggleState[k]=!toggleState[k];const on=toggleState[k];
    if(item.name==='Show Watermark')document.getElementById('watermark').classList.toggle('open',on);
    if(item.name==='Spectator List')document.getElementById('spectator-list').classList.toggle('open',on);
    if(item.name==='Keybind List')document.getElementById('keybind-list').classList.toggle('open',on);
    notify(item.name,on?'Enabled':'Disabled','fa-solid fa-bolt');
  }else if(item.type==='button'){
    notify(item.name,'Triggered','fa-solid fa-bolt');
  }else if(item.type==='online'){onlineMode=true;onlineTab=-1;onlineItemIdx=0;}
  else if(item.type==='sub'){stack.push({menu:item.children,idx:0});}
  else if(item.type==='slider'){adjSlider(item,dir);}
  else if(item.type==='value'&&item.actions){
    cycleVal(item,dir);
    if(item.name==='Theme')applyTheme(item.val);
    if(item.name==='Menu Hotkey'){menuHotkey=item.val;notify('Hotkey',item.val,'fa-solid fa-keyboard');}
  }
  render();
}

function activateOnlineItem(){
  if(onlineTab===-1){
    const p=ONLINE_PLAYERS[onlineItemIdx];
    if(p){selectedPlrs.clear();selectedPlrs.add(p.id);notify('Ausgewählt','['+p.id+'] '+p.name,'fa-solid fa-user');}
  }else{
    const tn=OTN[onlineTab];
    const tabs=ONLINE_TABS[tn].filter(i=>i.type!=='sep');
    const item=tabs[onlineItemIdx];if(!item)return;
    const k='online||'+tn+'||'+item.name;
    if(item.type==='toggle'){toggleState[k]=!toggleState[k];notify(item.name,toggleState[k]?'Enabled':'Disabled','fa-solid fa-bolt');}
    else{notify(item.name,'Triggered','fa-solid fa-bolt');}
  }
  renderOnline();
}

function openMenu(){menuVisible=true;document.getElementById('wrapper').style.display='';render();}
function closeMenu(){menuVisible=false;document.getElementById('wrapper').style.display='none';stack=[{menu:MAIN,idx:0}];onlineMode=false;onlineTab=-1;onlineItemIdx=0;}

function kpShowKey(key){
  kpPending=key;
  const box=document.querySelector('#keypick-overlay .kp-box');
  const old=box.querySelector('.kp-pill');if(old)old.remove();
  const pill=document.createElement('span');pill.className='kp-pill';pill.textContent=key;
  box.insertBefore(pill,document.getElementById('kp-confirm'));
  document.getElementById('kp-waiting').style.display='none';
  document.getElementById('kp-key-display').textContent=key;
  document.getElementById('kp-confirm').style.display='';
  kpState='confirm';
}
function kpConfirm(){menuHotkey=kpPending;kpState='done';document.getElementById('keypick-overlay').classList.add('hidden');notify('Menu Key',kpPending+' = öffnen/schließen','fa-solid fa-keyboard');}

function openKbPicker(item){
  kbMode=true;kbPending={item,key:null};
  document.getElementById('kbpick-name').textContent=item.name;
  document.getElementById('kbpick-waiting').style.display='';
  document.getElementById('kbpick-confirm').style.display='none';
  const old=document.getElementById('kbpick-box').querySelector('.kp-pill');if(old)old.remove();
  document.getElementById('kbpick-overlay').classList.add('visible');
}
function closeKbPicker(){kbMode=false;kbPending=null;document.getElementById('kbpick-overlay').classList.remove('visible');}
function confirmKbPicker(){
  if(!kbPending?.key)return;
  keybinds[kbPending.item.name]=kbPending.key;
  closeKbPicker();renderKeybindList();
  notify('Keybind',kbPending.item.name+' → '+kbPending.key,'fa-solid fa-keyboard');
}

function handleKey(key){
  // KEY-PICK
  if(kpState!=='done'){
    if(kpState==='confirm'){
      if(key==='Enter'){kpConfirm();return;}
      if(key==='Backspace'){kpState='waiting';kpPending=null;const old=document.querySelector('#keypick-overlay .kp-box .kp-pill');if(old)old.remove();document.getElementById('kp-waiting').style.display='';document.getElementById('kp-confirm').style.display='none';return;}
      kpShowKey(key);return;
    }
    if(key==='Enter'||key==='Backspace')return;
    kpShowKey(key);return;
  }
  // KEYBIND PICKER
  if(kbMode){
    if(key==='Escape'||key==='Backspace'){if(key==='Backspace'&&kbPending?.key){delete keybinds[kbPending.item.name];closeKbPicker();renderKeybindList();return;}closeKbPicker();return;}
    if(key==='Enter'){confirmKbPicker();return;}
    if(KB_SKIP.has(key))return;
    kbPending.key=key;
    const box=document.getElementById('kbpick-box');const old=box.querySelector('.kp-pill');if(old)old.remove();
    const pill=document.createElement('span');pill.className='kp-pill';pill.textContent=key;
    box.insertBefore(pill,document.getElementById('kbpick-confirm'));
    document.getElementById('kbpick-waiting').style.display='none';
    document.getElementById('kbpick-key-display').textContent=key;
    document.getElementById('kbpick-confirm').style.display='';
    return;
  }
  // HOTKEY
  if(menuHotkey&&key===menuHotkey){if(menuVisible)closeMenu();else openMenu();return;}
  // KEYBIND TRIGGER
  if(!menuVisible){
    for(const[name,k] of Object.entries(keybinds)){
      if(key!==k)continue;
      const find=(menu)=>{for(const it of menu.items){if(it.name===name)return it;if(it.type==='sub'&&it.children){const f=find(it.children);if(f)return f;}}return null;};
      const it=find(MAIN);if(!it)continue;
      const mk=Object.keys(toggleState).find(mk2=>mk2.endsWith('||'+name))||('Main Menu||'+name);
      if(it.type==='toggle'){toggleState[mk]=!toggleState[mk];if(it.name==='Show Watermark')document.getElementById('watermark').classList.toggle('open',toggleState[mk]);renderKeybindList();notify(name,toggleState[mk]?'Enabled':'Disabled','fa-solid fa-bolt');}
      else if(it.type==='button'){notify(name,'Triggered','fa-solid fa-bolt');}
      return;
    }
    return;
  }
  // ONLINE MODE
  if(onlineMode){
    const isL=onlineTab===-1;
    const tabs=isL?[]:ONLINE_TABS[OTN[onlineTab]].filter(i=>i.type!=='sep');
    if(key==='ArrowDown'){onlineItemIdx=Math.min(onlineItemIdx+1,(isL?ONLINE_PLAYERS.length:tabs.length)-1);renderOnline();}
    else if(key==='ArrowUp'){onlineItemIdx=Math.max(onlineItemIdx-1,0);renderOnline();}
    else if(key==='Enter'||key==='ArrowRight'){activateOnlineItem();}
    else if(key==='ArrowLeft'||key==='Backspace'){if(!isL){onlineTab=-1;onlineItemIdx=0;renderOnline();}else{onlineMode=false;render();}}
    else if(key==='TabRight'){const ALL=[-1,0,1,2];const ci=ALL.indexOf(onlineTab);onlineTab=ALL[(ci+1)%4];onlineItemIdx=0;renderOnline();}
    else if(key==='TabLeft'){const ALL=[-1,0,1,2];const ci=ALL.indexOf(onlineTab);onlineTab=ALL[(ci-1+4)%4];onlineItemIdx=0;renderOnline();}
    return;
  }
  // NORMAL MODE
  const vis=visItems();const st=cur();const it=vis[st.idx];
  if(key==='F6'&&it&&it.type!=='sep'&&it.type!=='sub'&&it.type!=='online'){openKbPicker(it);return;}
  if(key==='ArrowDown'){cur().idx=Math.min(st.idx+1,vis.length-1);render();}
  else if(key==='ArrowUp'){cur().idx=Math.max(st.idx-1,0);render();}
  else if(key==='Enter'||key==='ArrowRight'){activate(it,1);}
  else if(key==='ArrowLeft'){
    if(it?.type==='slider'){adjSlider(it,-1);render();}
    else if(it?.type==='value'&&it.actions){cycleVal(it,-1);if(it.name==='Theme')applyTheme(it.val);if(it.name==='Menu Hotkey'){menuHotkey=it.val;notify('Hotkey',it.val,'fa-solid fa-keyboard');}render();}
    else if(stack.length>1){stack.pop();render();}
  }
  else if(key==='Backspace'){if(stack.length>1){stack.pop();render();}else closeMenu();}
}

window.addEventListener('message',function(ev){
  const d=ev.data;if(!d?.type)return;
  if(d.type==='control'){handleKey(d.key);return;}
  if(d.type==='notify'){notify(d.title||'',d.msg||'',d.icon||'fa-solid fa-bell');return;}
  if(d.type==='updatePlayers'){
    ONLINE_PLAYERS=d.players||[];
    const me=ONLINE_PLAYERS.find(p=>p.me);if(me)MY_ID=me.id;
    if(onlineMode&&onlineTab===-1)renderOnline();
    return;
  }
});

setInterval(()=>{const el=document.getElementById('wm-time');if(!el)return;const n=new Date();el.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');},1000);
</script>
