<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cfx.gg Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:transparent;min-height:100vh;font-family:'DM Sans',sans-serif;user-select:none;overflow:hidden;}
:root{--accent:#ff3daf;--ag:rgba(255,61,175,.65);--ad:rgba(255,61,175,.16);--ab:rgba(255,61,175,.3);--as2:rgba(255,61,175,.5);--af:rgba(255,61,175,.4);--sel:rgba(255,61,175,.12);--hb:rgba(255,61,175,.1);--hl:rgba(255,61,175,.35);}
body.t-pink  {--accent:#ff3daf;--ag:rgba(255,61,175,.65);--ad:rgba(255,61,175,.16);--ab:rgba(255,61,175,.3);--as2:rgba(255,61,175,.5);--af:rgba(255,61,175,.4);--sel:rgba(255,61,175,.12);--hb:rgba(255,61,175,.1);--hl:rgba(255,61,175,.35);}
body.t-grey  {--accent:#9090b0;--ag:rgba(144,144,176,.6);--ad:rgba(144,144,176,.14);--ab:rgba(144,144,176,.26);--as2:rgba(144,144,176,.5);--af:rgba(144,144,176,.38);--sel:rgba(144,144,176,.11);--hb:rgba(144,144,176,.08);--hl:rgba(144,144,176,.28);}
body.t-yellow{--accent:#ffcc00;--ag:rgba(255,204,0,.7);--ad:rgba(255,204,0,.16);--ab:rgba(255,204,0,.32);--as2:rgba(255,204,0,.55);--af:rgba(255,204,0,.45);--sel:rgba(255,204,0,.12);--hb:rgba(255,204,0,.1);--hl:rgba(255,204,0,.38);}
body.t-cyan  {--accent:#00e5d4;--ag:rgba(0,229,212,.65);--ad:rgba(0,229,212,.14);--ab:rgba(0,229,212,.28);--as2:rgba(0,229,212,.5);--af:rgba(0,229,212,.38);--sel:rgba(0,229,212,.09);--hb:rgba(0,229,212,.08);--hl:rgba(0,229,212,.28);}
body.t-red   {--accent:#cc1010;--ag:rgba(204,16,16,.7);--ad:rgba(204,16,16,.18);--ab:rgba(204,16,16,.32);--as2:rgba(204,16,16,.55);--af:rgba(204,16,16,.44);--sel:rgba(204,16,16,.15);--hb:rgba(204,16,16,.12);--hl:rgba(204,16,16,.38);}
body.t-green {--accent:#39ff14;--ag:rgba(57,255,20,.65);--ad:rgba(57,255,20,.13);--ab:rgba(57,255,20,.28);--as2:rgba(57,255,20,.5);--af:rgba(57,255,20,.38);--sel:rgba(57,255,20,.09);--hb:rgba(57,255,20,.07);--hl:rgba(57,255,20,.28);}
body.t-blue  {--accent:#3d9fff;--ag:rgba(61,159,255,.65);--ad:rgba(61,159,255,.14);--ab:rgba(61,159,255,.28);--as2:rgba(61,159,255,.5);--af:rgba(61,159,255,.38);--sel:rgba(61,159,255,.1);--hb:rgba(61,159,255,.08);--hl:rgba(61,159,255,.28);}
body{display:flex;align-items:center;justify-content:flex-end;padding-right:24px;}
#menu{width:292px;background:#0d0d16;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.055),0 2px 0 0 var(--accent),0 30px 80px rgba(0,0,0,.97);overflow:hidden;position:relative;}
#menu::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px var(--ag);border-radius:50%;z-index:10;}
.banner{position:relative;height:91px;overflow:hidden;background:#09090f;}
.banner-fallback{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:32px;font-weight:800;letter-spacing:6px;color:transparent;-webkit-text-stroke:1.5px var(--accent);animation:bglow 3s ease-in-out infinite;}
@keyframes bglow{0%,100%{filter:drop-shadow(0 0 10px var(--ag));}50%{filter:drop-shadow(0 0 24px var(--ag));}}
.banner-overlay{position:absolute;inset:0;z-index:3;background:linear-gradient(to bottom,transparent 45%,rgba(13,13,22,.85) 100%);}
.banner-radial{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 100% 80% at 50% 0%,var(--hb) 0%,transparent 70%);}
.breadcrumb{background:#0d0d16;padding:6px 13px 7px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:6px;min-height:30px;}
.bc-icon{font-size:10px;color:var(--accent);opacity:.7;flex-shrink:0;}
.bc-text{font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.28);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bc-count{font-size:8.5px;color:rgba(255,255,255,.16);font-family:monospace;flex-shrink:0;}
#otabs{display:none;background:#0a0a12;border-bottom:1px solid rgba(255,255,255,.04);}
#otabs.vis{display:flex;}
.ot{flex:1;height:31px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:8.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.2);border-bottom:2px solid transparent;transition:all .15s;}
.ot i{font-size:8px;}
.ot.act{color:#fff;border-bottom-color:var(--accent);text-shadow:0 0 8px var(--ag);}
.cnt{overflow-y:auto;max-height:370px;scrollbar-width:thin;scrollbar-color:var(--af) transparent;}
.cnt::-webkit-scrollbar{width:2px;}.cnt::-webkit-scrollbar-thumb{background:var(--af);border-radius:2px;}
.item{display:flex;align-items:center;padding:0 13px;height:35px;border-bottom:1px solid rgba(255,255,255,.022);gap:9px;position:relative;}
.item.sel{background:var(--sel);}
.item.sel::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;background:var(--accent);border-radius:0 2px 2px 0;box-shadow:0 0 8px var(--ag);}
.ii{width:15px;text-align:center;font-size:10px;flex-shrink:0;color:rgba(255,255,255,.16);}
.item.sel .ii{color:var(--accent);filter:drop-shadow(0 0 4px var(--ag));}
.in{font-size:12px;font-weight:400;color:#a0a0bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;text-align:left;}
.item.sel .in{color:#fff;font-weight:500;}
.tgl{width:30px;height:15px;background:#191927;border-radius:8px;position:relative;border:1px solid rgba(255,255,255,.055);flex-shrink:0;transition:background .2s,border-color .2s;}
.tgl::after{content:'';position:absolute;width:11px;height:11px;background:#2a2a40;border-radius:50%;top:1px;left:1px;transition:left .2s,background .2s,box-shadow .2s;}
.tgl.on{background:var(--ad);border-color:var(--ab);}
.tgl.on::after{left:16px;background:var(--accent);box-shadow:0 0 7px var(--ag);}
.ar{font-size:9px;color:rgba(255,255,255,.18);flex-shrink:0;}
.item.sel .ar{color:rgba(255,255,255,.45);}
.srow{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sv{font-size:9.5px;color:#4a4a62;min-width:26px;text-align:right;}
.item.sel .sv{color:var(--accent);}
.str{width:60px;height:2.5px;background:#1c1c2c;border-radius:2px;position:relative;flex-shrink:0;}
.sf{height:100%;background:linear-gradient(90deg,var(--ad),var(--accent));border-radius:2px;}
.sth{position:absolute;width:10px;height:10px;background:var(--accent);border-radius:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--ag);}
.fp-icon{font-size:9px;color:rgba(255,255,255,.18);flex-shrink:0;}
.item.sel .fp-icon{color:var(--accent);}
.cv-val{font-size:10px;color:rgba(255,255,255,.3);flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:2px 7px;white-space:nowrap;max-width:115px;overflow:hidden;text-overflow:ellipsis;}
.item.sel .cv-val{color:var(--accent);border-color:var(--ab);background:var(--ad);}
.pc{width:15px;height:15px;border-radius:50%;flex-shrink:0;border:1.5px solid #1c1c30;background:#10101e;display:flex;align-items:center;justify-content:center;transition:all .14s;}
.pc.chk{border-color:var(--accent);background:var(--ad);box-shadow:0 0 7px var(--ag);}
.pc.chk::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);display:block;}
.sep{display:flex;align-items:center;gap:8px;padding:7px 13px 3px;font-size:7.5px;font-weight:600;letter-spacing:2.5px;color:var(--as2);text-transform:uppercase;}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--ad);}
.footer{background:#090910;border-top:1px solid rgba(255,255,255,.035);padding:4px 11px;display:flex;align-items:center;min-height:24px;}
.footer-l{display:flex;align-items:center;gap:6px;}
.footer-logo{width:11px;height:11px;fill:var(--accent);opacity:.4;}
.footer-brand{font-size:8.5px;color:rgba(255,255,255,.18);}
.footer-brand span{color:var(--af);}
.footer-nav{display:flex;gap:8px;font-size:8px;color:rgba(255,255,255,.13);margin-left:auto;}
.footer-nav span{display:flex;align-items:center;gap:2px;}
.footer-nav i{font-size:7.5px;}
#nc{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column-reverse;gap:6px;z-index:9999;pointer-events:none;width:210px;}
.notify{background:#0b0b16;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:9px;animation:nIn .2s cubic-bezier(.22,1,.36,1);overflow:hidden;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.85);}
@keyframes nIn{from{transform:translateX(12px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.n-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 6px var(--ag);}
.n-body{display:flex;flex-direction:column;flex:1;min-width:0;}
.n-title{font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.n-msg{font-size:9px;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.n-bar{position:absolute;bottom:0;left:0;height:1.5px;width:100%;background:var(--accent);opacity:.5;}
#kpo{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px;}
#kpo.hidden{display:none;}
.kpb{display:flex;flex-direction:column;align-items:center;gap:13px;background:#0a0a14;border:1px solid rgba(255,255,255,.08);border-top:2px solid var(--accent);border-radius:10px;padding:20px 38px 18px;box-shadow:0 20px 60px rgba(0,0,0,.97);min-width:225px;text-align:center;}
.kpt{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.22);}
.kpw{font-size:10.5px;color:rgba(255,255,255,.14);animation:blk 1.4s ease-in-out infinite;}
@keyframes blk{0%,100%{opacity:.14;}50%{opacity:.42;}}
.kpp{background:#0e0e1e;border:1px solid rgba(255,255,255,.11);border-bottom:3px solid var(--accent);border-radius:7px;padding:5px 20px;font-size:19px;font-weight:700;letter-spacing:2px;color:var(--accent);font-family:'Syne',sans-serif;box-shadow:0 0 20px var(--ad);min-width:56px;}
.kpc{font-size:8.5px;color:rgba(255,255,255,.18);}
.kpc span{color:var(--accent);font-weight:600;}
.skip-btn{margin-top:2px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:4px 14px;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.2);cursor:pointer;font-family:inherit;}
</style>
</head>
<body class="t-pink">

<div id="nc"></div>

<!-- KEY PICKER -->
<div id="kpo">
  <div class="kpb">
    <span class="kpt">Set Menu Hotkey</span>
    <span class="kpw" id="kpw">press any key...</span>
    <span id="kpcf" style="display:none" class="kpc">
      <span id="kpkd"></span> — <span>Enter</span> confirm · <span style="color:#333">Esc</span> retry
    </span>
    <button class="skip-btn" id="skip-kp">skip — use F4</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" style="display:none">
  <div class="banner">
    <div class="banner-radial"></div>
    <div class="banner-fallback" id="banner-text">cfx.gg</div>
    <div class="banner-overlay"></div>
  </div>
  <div class="breadcrumb">
    <i class="bc-icon fa-solid fa-house" id="bc-icon"></i>
    <span class="bc-text" id="bc"></span>
    <span class="bc-count" id="fct"></span>
  </div>
  <div id="otabs">
    <div class="ot act" data-tab="-1"><i class="fa-solid fa-users"></i> Players</div>
    <div class="ot" data-tab="0"><i class="fa-solid fa-shield"></i> Safe</div>
    <div class="ot" data-tab="1"><i class="fa-solid fa-skull"></i> Risk</div>
    <div class="ot" data-tab="2"><i class="fa-solid fa-car"></i> Vehicle</div>
  </div>
  <div class="cnt" id="cnt"></div>
  <div class="footer">
    <div class="footer-l">
      <svg class="footer-logo" viewBox="0 0 16 16"><path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.052.052 0 0 1 .053.007c.08.066.164.132.248.195a.051.051 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.03.03.052.052 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019z"/></svg>
      <span class="footer-brand"><span>cfx.gg</span></span>
    </div>
    <div class="footer-nav">
      <span><i class="fa-solid fa-arrow-up"></i><i class="fa-solid fa-arrow-down"></i></span>
      <span><i class="fa-solid fa-arrow-right"></i> open</span>
      <span><i class="fa-solid fa-delete-left"></i> back</span>
    </div>
  </div>
</div>

<script>
// ── ALLES WIRD VON LUA GESTEUERT ──
// HTML ist nur ein dummes Display.
// Lua schickt Messages via SendDuiMessage -> window.message event.
// HTML rendert was Lua sagt, schickt NICHTS zurück.

const menu   = document.getElementById('menu');
const cnt    = document.getElementById('cnt');
const bc     = document.getElementById('bc');
const bcIcon = document.getElementById('bc-icon');
const fct    = document.getElementById('fct');
const otabs  = document.getElementById('otabs');
const kpo    = document.getElementById('kpo');
const kpw    = document.getElementById('kpw');
const kpcf   = document.getElementById('kpcf');
const kpkd   = document.getElementById('kpkd');
const nc     = document.getElementById('nc');

// ── THEME ──
const THEMES = {
  pink:'t-pink', grey:'t-grey', yellow:'t-yellow',
  cyan:'t-cyan', red:'t-red', green:'t-green', blue:'t-blue'
};
function setTheme(t){ document.body.className = THEMES[t] || 't-pink'; }

// ── NOTIFY ──
function notify(title, msg){
  while(nc.children.length >= 3) nc.firstChild.remove();
  const d = document.createElement('div');
  d.className = 'notify';
  d.innerHTML = `<div class="n-dot"></div><div class="n-body"><div class="n-title">${title}</div>${msg?`<div class="n-msg">${msg}</div>`:''}</div><div class="n-bar"></div>`;
  nc.appendChild(d);
  const bar = d.querySelector('.n-bar');
  requestAnimationFrame(()=>{ bar.style.transition='width 3s linear'; bar.style.width='0%'; });
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .18s'; setTimeout(()=>d.remove(),200); }, 3000);
}

// ── KEY PICKER ──
// Lua schickt: pickerShowKey, pickerDone
// Skip-Button: Lua hat keinen Handler dafür nötig —
// wir schicken nichts zurück, Lua erkennt selbst wenn Skip gedrückt wird
// (Skip ist im Lua-Thread als F4 direkt wählbar)
// ABER: skip-btn klick -> wir zeigen nur "F4" an, Lua erkennt das selbst
document.getElementById('skip-kp').addEventListener('click', ()=>{
  // Lua erkennt F4 selbst im Key-Picker-Thread
  // Wir zeigen nur visuell an
  kpkd.textContent = 'F4';
  kpw.style.display = 'none';
  kpcf.style.display = '';
});

// ── ITEM RENDER ──
// Lua schickt items als Array von Objekten:
// {name, type, right} wobei right = html-string für den rechten Teil
// Lua baut das komplett zusammen, HTML rendert nur
function renderItems(items, selIdx, breadcrumb, icon, counter, showOtabs, activeTab){
  // Breadcrumb
  bc.textContent     = breadcrumb || '';
  bcIcon.className   = 'bc-icon ' + (icon || 'fa-solid fa-house');
  fct.textContent    = counter   || '';

  // Online Tabs
  if(showOtabs){
    otabs.classList.add('vis');
    otabs.querySelectorAll('.ot').forEach(el=>{
      el.classList.toggle('act', el.dataset.tab == activeTab);
    });
  } else {
    otabs.classList.remove('vis');
  }

  // Items
  cnt.innerHTML = items.map((item, i) => {
    if(item.type === 'sep'){
      return `<div class="sep">${item.name}</div>`;
    }
    const sel = i === selIdx;
    const selClass = sel ? ' sel' : '';
    const iconHtml = item.icon ? `<i class="ii ${item.icon}"></i>` : '';

    let right = '';
    if(item.right === 'toggle'){
      right = `<div class="tgl${item.on?' on':''}"></div>`;
    } else if(item.right === 'arrow'){
      right = `<i class="ar fa-solid fa-chevron-right"></i>`;
    } else if(item.right === 'button'){
      right = `<i class="fp-icon fa-solid fa-play"></i>`;
    } else if(item.right === 'slider'){
      const pct = item.pct || 0;
      right = `<div class="srow"><span class="sv">${item.val||0}</span><div class="str"><div class="sf" style="width:${pct}%"></div><div class="sth" style="left:${pct}%"></div></div></div>`;
    } else if(item.right === 'value'){
      right = `<span class="cv-val">${item.val||''}</span>`;
    } else if(item.right === 'player'){
      right = `<div class="pc${item.picked?' chk':''}"></div>`;
    }

    return `<div class="item${selClass}">${iconHtml}<span class="in">${item.name}</span>${right}</div>`;
  }).join('');
}

// ── MESSAGE HANDLER ──
// Lua schickt alles hier rein
window.addEventListener('message', ev => {
  const d = ev.data;
  if(!d || !d.type) return;

  switch(d.type){

    // Menu öffnen/schließen
    case 'open':
      kpo.classList.add('hidden');
      menu.style.display = '';
      break;

    case 'close':
      menu.style.display = 'none';
      break;

    // Komplettes Menü rendern
    // Lua schickt: {type:'render', items:[...], sel:N, bc:'pfad', icon:'fa-...', counter:'1/5', otabs:bool, activeTab:N}
    case 'render':
      renderItems(d.items, d.sel, d.bc, d.icon, d.counter, d.otabs, d.activeTab);
      // Selektiertes Item in Sicht scrollen
      const selEl = cnt.children[d.sel];
      if(selEl) selEl.scrollIntoView({block:'nearest'});
      break;

    // Einzelnes Toggle-State updaten (ohne alles neu zu rendern)
    case 'toggleState': {
      const el = cnt.children[d.idx];
      if(el){ const tgl = el.querySelector('.tgl'); if(tgl) tgl.classList.toggle('on', !!d.on); }
      break;
    }

    // Key Picker: Lua schickt gewählten Key
    case 'pickerShowKey':
      kpw.style.display = 'none';
      kpcf.style.display = '';
      kpkd.textContent = d.key || '';
      // Kpp Pill erzeugen wenn noch nicht da
      let pill = document.querySelector('.kpp');
      if(pill) pill.remove();
      pill = document.createElement('span');
      pill.className = 'kpp';
      pill.textContent = d.key || '';
      document.querySelector('.kpb').insertBefore(pill, kpcf);
      break;

    // Picker abgeschlossen
    case 'pickerDone':
      kpo.classList.add('hidden');
      break;

    // Notify
    case 'notify':
      notify(d.title || '', d.msg || '');
      break;

    // Theme
    case 'theme':
      setTheme(d.val);
      break;
  }
});
</script>
</body>
</html>
