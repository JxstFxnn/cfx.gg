<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>cfx.gg Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background: transparent !important; background-color: transparent !important; }
:root {
  --accent:#ff3daf; --accent-glow:rgba(255,20,147,0.7); --accent-dim:rgba(255,20,147,0.2);
  --accent-border:rgba(255,20,147,0.28); --accent-sep:rgba(255,20,147,0.45); --accent-fill:rgba(255,20,147,0.4);
  --sel-bg:rgba(255,20,145,0.41); --hbg-color:rgba(255,20,147,0.2); --hline-color:rgba(255,20,147,0.4);
}
body.theme-grey {
  --accent:#8a8aaa; --accent-glow:rgba(138,138,170,0.7); --accent-dim:rgba(138,138,170,0.15);
  --accent-border:rgba(138,138,170,0.25); --accent-sep:rgba(138,138,170,0.45); --accent-fill:rgba(138,138,170,0.4);
  --sel-bg:rgba(138,138,170,0.3); --hbg-color:rgba(138,138,170,0.15); --hline-color:rgba(138,138,170,0.4);
}
body.theme-red {
  --accent:#ffd400; --accent-glow:rgba(255,212,0,0.65); --accent-dim:rgba(255,212,0,0.18);
  --accent-border:rgba(255,200,0,0.35); --accent-sep:rgba(255,190,0,0.55); --accent-fill:rgba(255,204,0,0.60);
  --sel-bg:rgba(255,215,0,0.40); --hbg-color:rgba(255,210,0,0.22); --hline-color:rgba(255,200,0,0.50);
}
body { display:flex; justify-content:flex-end; align-items:center; min-height:100vh; padding-right:24px; font-family:'Inter',sans-serif; user-select:none; }

/* NOTIFY */
#notify-container { position:fixed; top:16px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:9999; pointer-events:none; min-width:240px; }
.notify { background:#0a0a12; border:1px solid rgba(255,255,255,0.09); border-left:2px solid var(--accent); padding:10px 16px 14px; border-radius:4px; min-width:240px; display:flex; flex-direction:column; animation:notifyIn 0.25s cubic-bezier(0.22,1,0.36,1); overflow:hidden; position:relative; box-shadow:0 8px 32px rgba(0,0,0,0.9); }
@keyframes notifyIn { from{transform:translateY(-14px) scale(0.97);opacity:0;} to{transform:translateY(0) scale(1);opacity:1;} }
.notify-header { display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; color:#fff; letter-spacing:0.3px; }
.notify-header i { color:var(--accent); font-size:11px; }
.notify-msg { font-size:10.5px; color:rgba(255,255,255,0.45); margin-top:3px; padding-left:19px; }
.notify-bar { height:2px; background:var(--accent); position:absolute; bottom:0; left:0; width:100%; box-shadow:0 0 6px var(--accent-glow); }

/* WRAPPER */
#wrapper { position:relative; background:transparent !important; }

/* MENU */
#menu { width:285px; background:#0d0d15; border-radius:3px; box-shadow:0 0 0 1px rgba(255,255,255,0.05),0 25px 70px rgba(0,0,0,0.95); position:relative; overflow:hidden; }

/* HEADER */
.header { position:relative; overflow:hidden; background:#0f0f18; border-bottom:1px solid rgba(255,255,255,0.05); }
.hbg { position:absolute; inset:0; background:radial-gradient(ellipse 130% 100% at 50% -5%,var(--hbg-color) 0%,transparent 60%); pointer-events:none; }
.banner-img { display:block; width:100%; height:90px; object-fit:cover; position:relative; z-index:1; }
.banner-fallback { display:none; width:100%; height:90px; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-size:38px; font-weight:700; letter-spacing:5px; text-transform:lowercase; color:transparent; -webkit-text-stroke:1.5px var(--accent); animation:glow 2.5s ease-in-out infinite; position:relative; z-index:1; }
@keyframes glow { 0%,100%{filter:drop-shadow(0 0 10px var(--accent-glow)) drop-shadow(0 0 25px var(--accent-dim));} 50%{filter:drop-shadow(0 0 18px var(--accent-glow)) drop-shadow(0 0 45px var(--accent-fill));} }
.breadcrumb { position:relative; padding:7px 0 10px; font-size:10px; color:rgba(255,255,255,0.38); letter-spacing:1px; text-transform:uppercase; text-align:center; }
.hline { position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--hline-color) 50%,transparent); }

/* SPECTATOR */
#spectator-list { display:none; position:fixed; top:14px; right:14px; width:160px; z-index:200; background:#0d0d15; border:1px solid rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 16px 40px rgba(0,0,0,0.9); }
#spectator-list.open { display:block; animation:panelIn 0.2s cubic-bezier(0.22,1,0.36,1); }
.spec-title { padding:6px 12px 5px; font-size:8px; letter-spacing:2.5px; font-weight:600; color:var(--accent-sep); text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.04); background:#0b0b13; }
.spec-row { display:flex; align-items:center; justify-content:space-between; padding:0 12px; height:32px; border-bottom:1px solid rgba(255,255,255,0.025); }
.spec-row:last-child { border:none; }
.spec-left { display:flex; align-items:center; gap:7px; min-width:0; }
.spec-dot { width:4px; height:4px; border-radius:50%; flex-shrink:0; background:var(--accent); box-shadow:0 0 4px var(--accent-glow); animation:specPulse 1.8s ease-in-out infinite; }
@keyframes specPulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
.spec-name { font-size:11px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px; color:var(--accent); }
.spec-dist { font-size:9px; color:rgba(255,255,255,0.28); font-family:monospace; flex-shrink:0; }

/* KEYBIND LIST */
#keybind-list { display:none; position:fixed; top:14px; left:14px; width:160px; z-index:200; background:#0d0d15; border:1px solid rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 16px 40px rgba(0,0,0,0.9); }
#keybind-list.open { display:block; animation:panelIn 0.2s cubic-bezier(0.22,1,0.36,1); }
@keyframes panelIn { from{opacity:0;transform:translateY(-5px) scale(0.98);} to{opacity:1;transform:translateY(0) scale(1);} }
.kb-title { padding:6px 10px 5px; font-size:8px; letter-spacing:2.5px; font-weight:600; color:var(--accent-sep); text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.04); background:#0b0b13; }
.kb-item { padding:0 10px; height:30px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.03); gap:6px; }
.kb-item:last-child { border:none; }
.kb-item-name { flex:1; font-size:10px; color:#888; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kb-item-right { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.kb-status-on { font-size:8.5px; font-weight:600; color:#3dff8a; letter-spacing:0.5px; }
.kb-status-off { font-size:8.5px; font-weight:600; color:var(--accent); opacity:0.5; letter-spacing:0.5px; }
.kb-key { background:#1c1c2a; border:1px solid rgba(255,255,255,0.08); border-radius:2px; padding:1px 6px; font-size:9px; color:#aaa; font-family:monospace; }
.kb-empty { padding:12px 10px; font-size:9px; color:rgba(255,255,255,0.15); text-align:center; letter-spacing:0.5px; }

/* WATERMARK */
#watermark { display:none; position:fixed; top:0; left:0; z-index:200; background:#0a0a12; border-right:1px solid rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.05); border-radius:0 0 4px 0; box-shadow:2px 2px 14px rgba(0,0,0,0.7); font-family:'Courier New',Courier,monospace; }
#watermark.open { display:block; }
.wm-bar { display:flex; align-items:center; height:22px; padding:0 10px 0 8px; }
.wm-seg { display:flex; align-items:center; gap:6px; padding:0 8px; height:100%; border-right:1px solid rgba(255,255,255,0.04); white-space:nowrap; flex-shrink:0; }
.wm-seg:first-child { padding-left:0; } .wm-seg:last-child { border-right:none; }
.wm-seg.push { margin-left:auto; border-right:none; border-left:1px solid rgba(255,255,255,0.04); }
.wm-icon { width:11px; height:11px; fill:var(--accent); flex-shrink:0; opacity:0.8; }
.wm-label { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:lowercase; color:var(--accent); }
.wm-val { font-size:9.5px; color:rgba(255,255,255,0.42); }
.wm-val.dim { color:rgba(255,255,255,0.2); } .wm-val.green { color:#3dff8a; }
.wm-time-val { font-size:9.5px; color:rgba(255,255,255,0.3); letter-spacing:0.5px; }

/* CONTENT */
.content { overflow-y:auto; max-height:400px; scrollbar-width:thin; scrollbar-color:var(--accent-fill) transparent; }
.content::-webkit-scrollbar { width:3px; }
.content::-webkit-scrollbar-thumb { background:var(--accent-fill); border-radius:2px; }

/* ITEMS */
.item { display:flex; align-items:center; justify-content:space-between; padding:0 14px; height:37px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.025); position:relative; transition:background 0.08s; }
.item:hover:not(.selected) { background:rgba(255,255,255,0.02); }
.item.selected { background:var(--sel-bg); }
.item.selected .iname { color:#fff; font-weight:500; }
.iname { font-size:12.5px; color:#b8b8c8; letter-spacing:0.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
.toggle { width:32px; height:16px; background:#20202e; border-radius:8px; position:relative; border:1px solid rgba(255,255,255,0.05); flex-shrink:0; transition:background 0.22s; }
.toggle::after { content:''; position:absolute; width:12px; height:12px; background:#353548; border-radius:50%; top:1px; left:1px; transition:left 0.22s cubic-bezier(0.4,0,0.2,1),background 0.22s,box-shadow 0.22s; }
.toggle.on { background:var(--accent-dim); border-color:var(--accent-border); }
.toggle.on::after { left:17px; background:var(--accent); box-shadow:0 0 7px var(--accent-glow); }
.srow { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.sval { font-size:10px; color:#888; min-width:30px; text-align:right; font-weight:500; }
.item.selected .sval { color:var(--accent); }
.slidertrack { width:72px; height:3px; background:#252535; border-radius:2px; position:relative; flex-shrink:0; }
.sliderfill { height:100%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); border-radius:2px; transition:width 0.08s; }
.sliderthumb { position:absolute; width:12px; height:12px; background:var(--accent); border-radius:50%; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 6px var(--accent-glow); transition:left 0.08s; }
.ival { font-size:11px; color:#484858; font-weight:300; flex-shrink:0; white-space:nowrap; }
.ival .ca { color:#444; font-size:10px; }
.item.selected .ival { color:#aaa; }
.item.selected .ival .ca { color:#777; }
.arr { font-size:12px; color:#444; flex-shrink:0; }
.item.selected .arr { color:#aaa; }
.fp { width:14px; height:14px; flex-shrink:0; opacity:0.22; transition:opacity 0.1s; }
.item.selected .fp { opacity:0.65; }
.plr-check { width:18px; height:18px; border-radius:50%; flex-shrink:0; border:1.5px solid #252540; background:#14142a; display:flex; align-items:center; justify-content:center; transition:border-color 0.18s,background 0.18s,box-shadow 0.18s; }
.plr-check.checked { border-color:var(--accent); background:var(--accent-dim); box-shadow:0 0 8px var(--accent-glow); }
.plr-check.checked::after { content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 5px var(--accent-glow); display:block; }

/* ONLINE TABS */
#online-tabs { display:none; background:#0b0b14; border-bottom:1px solid rgba(255,255,255,0.04); padding:0 8px; }
#online-tabs.visible { display:flex; }
.otab { flex:1; height:30px; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:rgba(255,255,255,0.25); cursor:pointer; border-bottom:2px solid transparent; transition:color 0.15s,border-color 0.15s; position:relative; }
.otab.active { color:#fff; border-bottom-color:var(--accent); }
.otab.active::after { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:16px; height:2px; background:var(--accent); box-shadow:0 0 5px var(--accent-glow); }

/* SEP */
.sep { display:flex; align-items:center; gap:10px; padding:9px 14px 4px; font-size:8.5px; font-weight:500; letter-spacing:2px; color:var(--accent-sep); text-transform:uppercase; }
.sep::before,.sep::after { content:''; flex:1; height:1px; background:var(--accent-dim); }

/* FOOTER */
.footer-gap { height:5px; background:#07070e; }
.footer { background:#0a0a12; border-top:1px solid rgba(255,255,255,0.04); padding:5px 10px 5px 8px; display:flex; justify-content:space-between; align-items:center; }
.footer-left { display:flex; align-items:center; gap:6px; }
.footer-icon { width:14px; height:14px; opacity:0.4; fill:var(--accent); }
.fbrand { font-size:9px; color:rgba(255,255,255,0.2); }
.fbrand span { color:var(--accent-fill); }
.fcnt { font-size:9px; color:#2a2a38; }

/* KEYBIND OVERLAY */
#keybind-overlay { position:fixed; inset:0; z-index:9997; display:none; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:48px; pointer-events:none; }
#keybind-overlay.visible { display:flex; }
.open-key-box { display:flex; flex-direction:column; align-items:center; gap:12px; background:rgba(8,8,16,0.92); border:1px solid rgba(255,255,255,0.07); border-top:2px solid var(--accent); border-radius:6px; padding:20px 36px 18px; backdrop-filter:blur(16px); box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 20px 60px rgba(0,0,0,0.95); animation:overlayIn 0.25s cubic-bezier(0.22,1,0.36,1); min-width:220px; text-align:center; }
@keyframes overlayIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
.okb-title { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.25); }
.okb-waiting { font-size:11px; color:rgba(255,255,255,0.18); letter-spacing:1px; animation:waitBlink 1.4s ease-in-out infinite; }
@keyframes waitBlink { 0%,100%{opacity:0.18;} 50%{opacity:0.5;} }
.key-pill { background:#0e0e1e; border:1px solid rgba(255,255,255,0.14); border-bottom:3px solid rgba(255,255,255,0.20); border-radius:5px; padding:6px 20px; font-size:18px; font-weight:700; letter-spacing:1.5px; color:var(--accent); font-family:'Rajdhani',sans-serif; box-shadow:0 0 20px var(--accent-dim); min-width:60px; animation:keyAppear 0.2s cubic-bezier(0.22,1,0.36,1); }
@keyframes keyAppear { from{transform:scale(0.85);opacity:0;} to{transform:scale(1);opacity:1;} }
.okb-confirm { font-size:9.5px; color:rgba(255,255,255,0.22); letter-spacing:0.5px; }
.okb-confirm span { color:var(--accent); font-weight:600; }
</style>
</head>
<body>

<div id="notify-container"></div>

<div id="watermark">
  <div class="wm-bar">
    <div class="wm-seg">
      <svg class="wm-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.052.052 0 0 1 .053.007c.08.066.164.132.248.195a.051.051 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.03.03.052.052 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019z"/></svg>

// STATE
const stack=[{menu:MAIN,idx:0}];
const toggleState={};
const selectedPlrs=new Set();
const keybinds={};
let kbPickMode=false,kbPending=null;
let menuVisible=false;
// Key-Pick für Menu Open/Close Key
let menuHotkey=null;
let keyPickMode=true;  // true = warte auf Open-Key beim Start
let pendingKey=null;
const FORBIDDEN_KEYS=new Set(['Tab','Escape','Backspace','Shift','Control','Alt','Meta','CapsLock']);

function cur(){return stack[stack.length-1];}
function allItems(){return cur().menu.items;}
function visItems(){return allItems().filter(i=>i.type!=='sep');}
function makeKey(item){return stack.map(s=>s.menu.label).join('||')+'||'+item.name;}
function cycleVal(item,dir){let ci=item.actions.indexOf(item.val);if(ci===-1)ci=0;item.val=item.actions[(ci+dir+item.actions.length)%item.actions.length];}
function sliderStep(i){return(i.max-i.min)<=2?0.1:1;}
function sliderPct(i){return((i.val-i.min)/(i.max-i.min))*100;}
function sliderFmt(i){return parseFloat(i.val).toFixed(sliderStep(i)<1?1:0);}
function adjSlider(item,dir){const s=sliderStep(item);item.val=Math.min(item.max,Math.max(item.min,parseFloat((parseFloat(item.val)+dir*s).toFixed(10))));}

function notify(title,msg,icon){
  const c=document.getElementById('notify-container');
  while(c.children.length>=3) c.firstChild.remove();
  const n=document.createElement('div');n.className='notify';
  n.innerHTML=`<div class="notify-header"><i class="${icon||'fa-solid fa-bell'}"></i> ${title}</div><div class="notify-msg">${msg}</div><div class="notify-bar"></div>`;
  c.appendChild(n);
  const bar=n.querySelector('.notify-bar');
  requestAnimationFrame(()=>{bar.style.transition='width 3s linear';bar.style.width='0%';});
  setTimeout(()=>{n.style.transition='opacity 0.25s';n.style.opacity='0';setTimeout(()=>n.remove(),250);},3000);
}

function applyTheme(name){
  const map={'Default':'','Grey':'theme-grey','Red':'theme-red','Pink':''};
  document.body.className=map[name]||'';
  const bmap={'Default':'banner.png','Grey':'banner2.png','Red':'banner3.png','Pink':'banner.png'};
  const img=document.getElementById('banner-img');
  img.src=bmap[name]||'banner.png';img.style.display='block';
  document.getElementById('banner-fallback').style.display='none';
  img.onerror=()=>{img.style.display='none';document.getElementById('banner-fallback').style.display='flex';};
}

function renderOnline(){
  const tabBar=document.getElementById('online-tabs');
  tabBar.classList.add('visible');
  const isListView=onlineTab===-1;
  tabBar.querySelectorAll('.otab').forEach(t=>{
    const tv=parseInt(t.dataset.tab,10);
    t.classList.toggle('active',tv===onlineTab);
    t.onclick=()=>{onlineTab=tv;onlineItemIdx=0;render();};
  });
  const contentEl=document.getElementById('content');
  let html='';
  if(isListView){
    document.getElementById('bc').textContent='Online Options';
    ONLINE_PLAYERS.forEach((p,i)=>{
      const sel=i===onlineItemIdx;const checked=selectedPlrs.has(p);
      html+=`<div class="item${sel?' selected':''}" data-plr="${i}"><span class="iname">${p}</span><div class="plr-check${checked?' checked':''}"></div></div>`;
    });
  }else{
    const tabName=ONLINE_TAB_NAMES[onlineTab];
    document.getElementById('bc').textContent=`Online › ${tabName}`;
    const items=ONLINE_TABS[tabName];let vi=0;
    html=items.map(item=>{
      if(item.type==='sep')return`<div class="sep">${item.label}</div>`;
      const myVi=vi++;const sel=myVi===onlineItemIdx;const on=toggleState['online||'+tabName+'||'+item.name]||false;
      let right='';
      switch(item.type){
        case 'toggle':right=`<div class="toggle${on?' on':''}"></div>`;break;
        case 'slider':{const pct=sliderPct(item),d=sliderFmt(item);right=`<div class="srow"><span class="sval">${d}</span><div class="slidertrack"><div class="sliderfill" style="width:${pct}%"></div><div class="sliderthumb" style="left:${pct}%"></div></div></div>`;break;}
        case 'value':right=item.actions?`<span class="ival"><span class="ca">‹ </span>${item.val}<span class="ca"> ›</span></span>`:`<span class="ival">${item.val}</span>`;break;
        case 'button':right=FP_SVG;break;
        default:right=`<span class="arr">»</span>`;
      }
      return`<div class="item${sel?' selected':''}" data-ovi="${myVi}"><span class="iname">${item.name}</span>${right}</div>`;
    }).join('');
  }
  contentEl.innerHTML=html;
  document.getElementById('fcnt').textContent=isListView?`${selectedPlrs.size} / ${ONLINE_PLAYERS.length}`:ONLINE_TAB_NAMES[onlineTab];
  contentEl.querySelectorAll('[data-plr]').forEach(div=>{div.addEventListener('click',()=>{const i=parseInt(div.dataset.plr,10);onlineItemIdx=i;const p=ONLINE_PLAYERS[i];if(selectedPlrs.has(p))selectedPlrs.delete(p);else selectedPlrs.add(p);render();});});
  contentEl.querySelectorAll('[data-ovi]').forEach(div=>{div.addEventListener('click',()=>{onlineItemIdx=parseInt(div.dataset.ovi,10);activateOnlineItem();});});
  const focused=contentEl.querySelector('.item.selected');if(focused)focused.scrollIntoView({block:'nearest'});
}

function render(){
  if(onlineMode){renderOnline();return;}
  document.getElementById('online-tabs').classList.remove('visible');
  const{menu,idx}=cur();
  document.getElementById('bc').textContent=menu.label;
  let vi=0;
  const html=allItems().map(item=>{
    if(item.type==='sep')return`<div class="sep">${item.label}</div>`;
    const myVi=vi++;const sel=myVi===idx;const on=toggleState[makeKey(item)]||false;
    let right='';
    switch(item.type){
      case 'toggle':right=`<div class="toggle${on?' on':''}"></div>`;break;
      case 'slider':{const pct=sliderPct(item),d=sliderFmt(item);right=`<div class="srow"><span class="sval">${d}</span><div class="slidertrack"><div class="sliderfill" style="width:${pct}%"></div><div class="sliderthumb" style="left:${pct}%"></div></div></div>`;break;}
      case 'value':right=item.actions?`<span class="ival"><span class="ca">‹ </span>${item.val}<span class="ca"> ›</span></span>`:`<span class="ival">${item.val}</span>`;break;
      case 'sub':case 'online':right=`<span class="arr">»</span>`;break;
      case 'button':right=FP_SVG;break;
    }
    return`<div class="item${sel?' selected':''}" data-vi="${myVi}"><span class="iname">${item.name}</span>${right}</div>`;
  }).join('');
  document.getElementById('content').innerHTML=html;
  const vis=visItems();
  document.getElementById('fcnt').textContent=`${Math.min(idx+1,vis.length)} / ${vis.length}`;
  document.querySelectorAll('.item').forEach(div=>{div.addEventListener('click',()=>{const myVi=parseInt(div.dataset.vi,10);if(isNaN(myVi))return;cur().idx=myVi;activate(visItems()[myVi],1);});});
  const focused=document.querySelector('.item.selected');if(focused)focused.scrollIntoView({block:'nearest'});
}

function activateOnlineItem(){
  const tabName=ONLINE_TAB_NAMES[onlineTab];
  const items=ONLINE_TABS[tabName].filter(i=>i.type!=='sep');
  const item=items[onlineItemIdx];if(!item)return;
  const k='online||'+tabName+'||'+item.name;
  if(item.type==='toggle'){toggleState[k]=!toggleState[k];render();}
  else if(item.type==='value'&&item.actions){cycleVal(item,1);render();}
  else render();
}

function activate(item,dir){
  if(!item)return;
  const k=makeKey(item);
  if(item.type==='toggle'){
    toggleState[k]=!toggleState[k];const on=toggleState[k];
    if(item.name==='Spectator List')document.getElementById('spectator-list').classList.toggle('open',on);
    if(item.name==='Keybind List')document.getElementById('keybind-list').classList.toggle('open',on);
    if(item.name==='Show Watermark')document.getElementById('watermark').classList.toggle('open',on);
    notify(item.name,on?'Enabled':'Disabled','fa-solid fa-bolt');
    render();
  }else if(item.type==='online'){onlineMode=true;onlineTab=-1;onlineItemIdx=0;render();}
  else if(item.type==='sub'){stack.push({menu:item.children,idx:0});render();}
  else if(item.type==='value'&&item.actions){
    cycleVal(item,dir);
    if(item.name==='Theme'){applyTheme(item.val);notify('Theme',`Changed to ${item.val}`,'fa-solid fa-palette');}
    render();
  }else render();
}

// KEYBIND
const KB_FORBIDDEN=new Set(['Tab','Shift','Control','Alt','Meta','CapsLock',' ']);
function openKeybindPicker(item){
  kbPickMode=true;kbPending={item,key:null};
  document.getElementById('kob-item-name').textContent=item.name;
  document.getElementById('kob-waiting').style.display='';
  document.getElementById('kob-confirm').style.display='none';
  const old=document.getElementById('kob').querySelector('.key-pill');if(old)old.remove();
  document.getElementById('keybind-overlay').classList.add('visible');
}
function closeKeybindPicker(){kbPickMode=false;kbPending=null;document.getElementById('keybind-overlay').classList.remove('visible');}
function confirmKeybind(){
  if(!kbPending||!kbPending.key)return;
  const{item,key}=kbPending;keybinds[item.name]={key,type:item.type};
  closeKeybindPicker();renderKeybindList();
  notify('Keybind',item.name+' → '+key,'fa-solid fa-keyboard');
}
function renderKeybindList(){
  const el=document.getElementById('kb-items');if(!el)return;
  const entries=Object.entries(keybinds);
  if(entries.length===0){el.innerHTML='<div class="kb-empty">No keybinds set<br><span style="opacity:.5;font-size:8px">F6 on any item</span></div>';return;}
  el.innerHTML=entries.map(([name,{key,type}])=>{
    const isToggle=type==='toggle';
    const on=isToggle&&Object.entries(toggleState).some(([k,v])=>k.endsWith('||'+name)&&v===true);
    const sh=isToggle?(on?'<span class="kb-status-on">ON</span>':'<span class="kb-status-off">OFF</span>'):'';
    return`<div class="kb-item"><span class="kb-item-name">${name}</span><div class="kb-item-right">${sh}<span class="kb-key">${key}</span></div></div>`;
  }).join('');
}

// ══════════════════════════════════════════
//  KEY-PICK OVERLAY (Open/Close Key)
// ══════════════════════════════════════════
// Overlay HTML ist schon im DOM als #keybind-overlay mit id="kob"
// Wir bauen ein zweites einfaches Overlay für den Menu-Open-Key
function showKeyPickOverlay(){
  // Zeige kob overlay mit anderem Titel
  document.getElementById('kob-item-name').textContent='Menu Open/Close Key';
  document.getElementById('kob-waiting').style.display='';
  document.getElementById('kob-confirm').style.display='none';
  const old=document.getElementById('kob').querySelector('.key-pill');if(old)old.remove();
  document.getElementById('keybind-overlay').classList.add('visible');
}
function hideKeyPickOverlay(){
  document.getElementById('keybind-overlay').classList.remove('visible');
}
function showPendingKey(key){
  pendingKey=key;
  const kob=document.getElementById('kob');
  const old=kob.querySelector('.key-pill');if(old)old.remove();
  const pill=document.createElement('span');pill.className='key-pill';pill.textContent=key;
  kob.insertBefore(pill,document.getElementById('kob-confirm'));
  document.getElementById('kob-waiting').style.display='none';
  document.getElementById('kob-confirm').style.display='';
}
function confirmMenuKey(key){
  menuHotkey=key;keyPickMode=false;
  hideKeyPickOverlay();
  notify('Menu Key',key+' = öffnen / schließen','fa-solid fa-keyboard');
}

// Zeige Key-Pick beim Start
showKeyPickOverlay();

// ══════════════════════════════════════════
//  handleKey — EINZIGE Navigationsfunktion
//  Wird von keydown UND von Lua-Messages aufgerufen
// ══════════════════════════════════════════
function closeMenu(){
  menuVisible=false;
  document.getElementById('wrapper').style.display='none';
  while(stack.length>1)stack.pop();
  onlineMode=false;onlineTab=-1;onlineItemIdx=0;
  // Lua informieren: Controls freigeben
  try{ window.parent.postMessage({type:'control',key:'__close__'},'*'); }catch(e){}
}
function openMenu(){
  menuVisible=true;
  document.getElementById('wrapper').style.display='';
  render();
  // Lua informieren: Controls sperren
  try{ window.parent.postMessage({type:'control',key:'__open__'},'*'); }catch(e){}
}

function handleKey(key){

  // ── KEY-PICK für Menu-Hotkey (höchste Priorität wenn aktiv) ──
  if(keyPickMode&&!kbPickMode){
    if(key==='Enter'){if(pendingKey)confirmMenuKey(pendingKey);return;}
    if(FORBIDDEN_KEYS.has(key))return;
    showPendingKey(key);
    return;
  }

  // ── KEYBIND PICKER (F6-Overlay) ──
  if(kbPickMode){
    if(key==='Escape'){closeKeybindPicker();return;}
    if(key==='Enter'){if(kbPending&&kbPending.key)confirmKeybind();return;}
    if(key==='Backspace'){if(kbPending){delete keybinds[kbPending.item.name];closeKeybindPicker();renderKeybindList();}return;}
    if(KB_FORBIDDEN.has(key))return;
    kbPending.key=key;
    const kob=document.getElementById('kob');
    const old=kob.querySelector('.key-pill');if(old)old.remove();
    const pill=document.createElement('span');pill.className='key-pill';pill.textContent=key;
    kob.insertBefore(pill,document.getElementById('kob-confirm'));
    document.getElementById('kob-waiting').style.display='none';
    document.getElementById('kob-confirm').style.display='';
    return;
  }

  // ── MENU TOGGLE via Hotkey ──
  if(key===menuHotkey){
    if(menuVisible)closeMenu();
    else{menuVisible=true;document.getElementById('wrapper').style.display='';render();}
    return;
  }

  // ── MENU GESCHLOSSEN — keybinds triggern ──
  if(!menuVisible){
    for(const[name,{key:k}]of Object.entries(keybinds)){
      if(key===k){
        function findItem(menu){for(const item of menu.items){if(item.name===name)return item;if(item.type==='sub'&&item.children){const f=findItem(item.children);if(f)return f;}}return null;}
        const item=findItem(MAIN);if(!item)return;
        if(item.type==='toggle'){
          const mk=Object.keys(toggleState).find(k=>k.endsWith('||'+name))||('Main Menu||'+name);
          toggleState[mk]=!toggleState[mk];
          renderKeybindList();notify(name,toggleState[mk]?'Enabled':'Disabled','fa-solid fa-bolt');
        }else if(item.type==='button'){notify(name,'Triggered','fa-solid fa-bolt');}
        return;
      }
    }
    return;
  }

  // ── ONLINE MODE ──
  if(onlineMode){
    const isListView=onlineTab===-1;
    const tabItems=isListView?[]:ONLINE_TABS[ONLINE_TAB_NAMES[onlineTab]].filter(i=>i.type!=='sep');
    const ALL_TABS=[-1,0,1,2];
    if(key==='ArrowDown'){onlineItemIdx=Math.min(onlineItemIdx+1,isListView?ONLINE_PLAYERS.length-1:tabItems.length-1);render();}
    else if(key==='ArrowUp'){onlineItemIdx=Math.max(onlineItemIdx-1,0);render();}
    else if(key==='ArrowRight'||key==='Enter'){
      if(isListView){const p=ONLINE_PLAYERS[onlineItemIdx];if(p){if(selectedPlrs.has(p))selectedPlrs.delete(p);else selectedPlrs.add(p);}}
      else{const item=tabItems[onlineItemIdx];if(item){if(item.type==='slider')adjSlider(item,1);else if(item.type==='value'&&item.actions)cycleVal(item,1);else activateOnlineItem();}}
      render();
    }else if(key==='ArrowLeft'){
      if(!isListView){const item=tabItems[onlineItemIdx];if(item&&item.type==='slider'){adjSlider(item,-1);render();}else if(item&&item.type==='value'&&item.actions){cycleVal(item,-1);render();}}
    }else if(key==='TabRight'||key==='e'||key==='E'){  // TabRight = Lua-eigener Key für E
      const ci=ALL_TABS.indexOf(onlineTab);onlineTab=ALL_TABS[(ci+1)%ALL_TABS.length];onlineItemIdx=0;render();
    }else if(key==='TabLeft'||key==='q'||key==='Q'){   // TabLeft = Lua-eigener Key für Q
      const ci=ALL_TABS.indexOf(onlineTab);onlineTab=ALL_TABS[(ci-1+ALL_TABS.length)%ALL_TABS.length];onlineItemIdx=0;render();
    }else if(key==='Backspace'){
      // Backspace: Tab-Ansicht → List; List → zurück zu Main
      if(!isListView){onlineTab=-1;onlineItemIdx=0;render();}
      else{onlineMode=false;render();}
    }else if(key==='Escape'){
      closeMenu();
    }
    return;
  }

  // ── NORMAL MODE ──
  const vis=visItems();const st=cur();const item=vis[st.idx];

  if(key==='F6'&&item&&item.type!=='sep'&&item.type!=='sub'&&item.type!=='online'){openKeybindPicker(item);return;}

  if(key==='ArrowDown'){cur().idx=Math.min(st.idx+1,vis.length-1);render();}
  else if(key==='ArrowUp'){cur().idx=Math.max(st.idx-1,0);render();}
  else if(key==='ArrowRight'||key==='Enter'){
    if(!item)return;
    if(item.type==='slider'){adjSlider(item,1);render();}
    else if(item.type==='value'&&item.actions){cycleVal(item,1);if(item.name==='Theme')applyTheme(item.val);render();}
    else activate(item,1);
  }else if(key==='ArrowLeft'){
    if(!item)return;
    if(item.type==='slider'){adjSlider(item,-1);render();}
    else if(item.type==='value'&&item.actions){cycleVal(item,-1);if(item.name==='Theme')applyTheme(item.val);render();}
    else if(stack.length>1){stack.pop();render();}
  }else if(key==='Backspace'){
    // Backspace: in Sub → einen zurück; im Root → Menu schließen
    if(stack.length>1){stack.pop();render();}
    else{closeMenu();}
  }else if(key==='Escape'){
    closeMenu();
  }
}

// keydown → handleKey (nur wenn kein keyPickMode oder kbPickMode)
document.addEventListener('keydown',e=>{
  if(keyPickMode||kbPickMode||menuVisible){e.preventDefault();e.stopPropagation();}
  handleKey(e.key);
});

// ══════════════════════════════════════════
//  MESSAGE HANDLER — Lua → HTML
// ══════════════════════════════════════════
window.addEventListener('message',function(event){
  const d=event.data;
  if(!d||!d.type)return;

  // Lua meldet Menu wurde von aussen geöffnet/geschlossen
  if(d.type==='setVisible'){
    if(d.value) openMenu(); else closeMenu();
    return;
  }

  // Lua schickt Taste → direkt an handleKey
  // __open__ / __close__ sind interne Signale von Lua zurück ans HTML
  // (passiert wenn Lua selbst den State tracked)
  if(d.type==='control'){
    if(d.key==='__open__'){ openMenu(); return; }
    if(d.key==='__close__'){ closeMenu(); return; }
    handleKey(d.key);
    return;
  }

  // Notify von Lua
  if(d.type==='notify'){
    notify(d.title||'',d.msg||'',d.icon||'fa-solid fa-bell');
    return;
  }
});

// Uhr
setInterval(()=>{
  const el=document.getElementById('wm-time');if(!el)return;
  const n=new Date();el.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
},1000);
</script>
