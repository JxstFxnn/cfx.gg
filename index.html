<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>cfx.gg Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:transparent!important;}
:root{--accent:#ff3daf;--ag:rgba(255,20,147,.7);--ad:rgba(255,20,147,.2);--ab:rgba(255,20,147,.28);--as2:rgba(255,20,147,.45);--af:rgba(255,20,147,.4);--sb:rgba(255,20,145,.41);--hb:rgba(255,20,147,.2);--hl:rgba(255,20,147,.4);}
body.t-grey{--accent:#8a8aaa;--ag:rgba(138,138,170,.7);--ad:rgba(138,138,170,.15);--ab:rgba(138,138,170,.25);--as2:rgba(138,138,170,.45);--af:rgba(138,138,170,.4);--sb:rgba(138,138,170,.3);--hb:rgba(138,138,170,.15);--hl:rgba(138,138,170,.4);}
body.t-yellow{--accent:#ffd400;--ag:rgba(255,212,0,.65);--ad:rgba(255,212,0,.18);--ab:rgba(255,200,0,.35);--as2:rgba(255,190,0,.55);--af:rgba(255,204,0,.6);--sb:rgba(255,215,0,.4);--hb:rgba(255,210,0,.22);--hl:rgba(255,200,0,.5);}
body.t-blue{--accent:#3d9fff;--ag:rgba(61,159,255,.7);--ad:rgba(61,159,255,.18);--ab:rgba(61,159,255,.3);--as2:rgba(61,159,255,.5);--af:rgba(61,159,255,.4);--sb:rgba(61,159,255,.35);--hb:rgba(61,159,255,.15);--hl:rgba(61,159,255,.4);}
body{display:flex;justify-content:flex-end;align-items:center;min-height:100vh;padding-right:24px;font-family:'Inter',sans-serif;user-select:none;pointer-events:none;}
#nc{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:9999;pointer-events:none;}
.notify{background:rgba(10,10,10,.9);border:1px solid rgba(255,255,255,.1);padding:12px 20px;border-radius:8px;min-width:250px;backdrop-filter:blur(10px);display:flex;flex-direction:column;animation:nIn .3s ease-out;overflow:hidden;position:relative;}
@keyframes nIn{from{transform:translateY(-20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.notify-header{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#fff;}
.notify-header i{color:var(--accent);}
.notify-msg{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;}
.notify-bar{height:2px;background:var(--accent);position:absolute;bottom:0;left:0;width:100%;}
#wm{display:none;position:fixed;top:0;left:0;z-index:200;background:#0a0a12;border-right:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);border-radius:0 0 4px 0;font-family:'Courier New',monospace;}
#wm.open{display:block;}
.wb{display:flex;align-items:center;height:22px;padding:0 10px 0 8px;}
.ws{display:flex;align-items:center;gap:6px;padding:0 8px;height:100%;border-right:1px solid rgba(255,255,255,.04);white-space:nowrap;flex-shrink:0;}
.ws:last-child{border-right:none;}.ws.push{margin-left:auto;border-right:none;border-left:1px solid rgba(255,255,255,.04);}
.wi{width:11px;height:11px;fill:var(--accent);opacity:.8;}
.wl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:lowercase;color:var(--accent);}
.wv{font-size:9.5px;color:rgba(255,255,255,.42);}
.wt2{font-size:9.5px;color:rgba(255,255,255,.3);}
#kl{display:none;position:fixed;top:14px;left:14px;width:160px;z-index:200;background:#0d0d15;border:1px solid rgba(255,255,255,.05);border-radius:3px;overflow:hidden;}
#kl.open{display:block;}
.kt{padding:6px 10px 5px;font-size:8px;letter-spacing:2.5px;font-weight:600;color:var(--as2);text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.04);background:#0b0b13;}
.ki{padding:0 10px;height:30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.03);gap:6px;}
.kin{flex:1;font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kir{display:flex;align-items:center;gap:5px;}
.kon{font-size:8.5px;font-weight:600;color:#3dff8a;}.kof{font-size:8.5px;font-weight:600;color:var(--accent);opacity:.5;}
.kk{background:#1c1c2a;border:1px solid rgba(255,255,255,.08);border-radius:2px;padding:1px 6px;font-size:9px;color:#aaa;font-family:monospace;}
#wrapper{position:relative;z-index:9990;}
#menu{width:285px;background:#0d0d15;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 25px 70px rgba(0,0,0,.95);overflow:hidden;}
.hdr{position:relative;overflow:hidden;background:#0f0f18;border-bottom:1px solid rgba(255,255,255,.05);}
.hbg{position:absolute;inset:0;background:radial-gradient(ellipse 130% 100% at 50% -5%,var(--hb) 0%,transparent 60%);pointer-events:none;}
.bimg{display:block;width:100%;height:90px;object-fit:cover;position:relative;z-index:1;}
.bfall{display:none;width:100%;height:90px;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:38px;font-weight:700;letter-spacing:5px;text-transform:lowercase;color:transparent;-webkit-text-stroke:1.5px var(--accent);animation:glow 2.5s ease-in-out infinite;position:relative;z-index:1;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px var(--ag));}50%{filter:drop-shadow(0 0 18px var(--ag));}}
.bc{position:relative;padding:7px 0 10px;font-size:10px;color:rgba(255,255,255,.38);letter-spacing:1px;text-transform:uppercase;text-align:center;}
.hline{position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--hl) 50%,transparent);}
#otabs{display:none;background:#0b0b14;border-bottom:1px solid rgba(255,255,255,.04);padding:0 8px;}
#otabs.vis{display:flex;}
.ot{flex:1;height:30px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.25);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.ot.act{color:#fff;border-bottom-color:var(--accent);}
.cnt{overflow-y:auto;max-height:400px;scrollbar-width:thin;scrollbar-color:var(--af) transparent;}
.cnt::-webkit-scrollbar{width:3px;}.cnt::-webkit-scrollbar-thumb{background:var(--af);border-radius:2px;}
.item{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:37px;border-bottom:1px solid rgba(255,255,255,.025);pointer-events:none;}
.item.sel{background:var(--sb);}.item.sel .in{color:#fff;font-weight:500;}
.in{font-size:12.5px;color:#b8b8c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;}
.tgl{width:32px;height:16px;background:#20202e;border-radius:8px;position:relative;border:1px solid rgba(255,255,255,.05);flex-shrink:0;transition:background .22s;}
.tgl::after{content:'';position:absolute;width:12px;height:12px;background:#353548;border-radius:50%;top:1px;left:1px;transition:left .22s,background .22s;}
.tgl.on{background:var(--ad);border-color:var(--ab);}
.tgl.on::after{left:17px;background:var(--accent);box-shadow:0 0 7px var(--ag);}
.srow{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sv{font-size:10px;color:#888;min-width:30px;text-align:right;}.item.sel .sv{color:var(--accent);}
.str{width:72px;height:3px;background:#252535;border-radius:2px;position:relative;flex-shrink:0;}
.sf{height:100%;background:linear-gradient(90deg,var(--ad),var(--accent));border-radius:2px;}
.sth{position:absolute;width:12px;height:12px;background:var(--accent);border-radius:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--ag);}
.iv{font-size:11px;color:#484858;font-weight:300;flex-shrink:0;white-space:nowrap;}
.iv .ca{color:#444;font-size:10px;}.item.sel .iv{color:#aaa;}.item.sel .iv .ca{color:#777;}
.ar{font-size:12px;color:#444;flex-shrink:0;}.item.sel .ar{color:#aaa;}
.fp{width:14px;height:14px;flex-shrink:0;opacity:.22;}.item.sel .fp{opacity:.65;}
.pc{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1.5px solid #252540;background:#14142a;display:flex;align-items:center;justify-content:center;transition:all .18s;}
.pc.chk{border-color:var(--accent);background:var(--ad);box-shadow:0 0 8px var(--ag);}
.pc.chk::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);display:block;}
.sep{display:flex;align-items:center;gap:10px;padding:9px 14px 4px;font-size:8.5px;font-weight:500;letter-spacing:2px;color:var(--as2);text-transform:uppercase;}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--ad);}
.fg{height:5px;background:#07070e;}
.ft{background:#0a0a12;border-top:1px solid rgba(255,255,255,.04);padding:5px 10px 5px 8px;display:flex;justify-content:space-between;align-items:center;}
.ftl{display:flex;align-items:center;gap:6px;}
.fi{width:14px;height:14px;opacity:.4;fill:var(--accent);}
.fb{font-size:9px;color:rgba(255,255,255,.2);}.fb span{color:var(--af);}
.fc{font-size:9px;color:#2a2a38;}
#kpo{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:48px;pointer-events:none;}
#kpo.hidden{display:none;}
.kpb{display:flex;flex-direction:column;align-items:center;gap:12px;background:#08080f;border:1px solid rgba(255,255,255,.08);border-top:2px solid var(--accent);border-radius:6px;padding:20px 36px 18px;box-shadow:0 0 0 1px rgba(255,255,255,.03),0 20px 60px rgba(0,0,0,.95);animation:kpI .3s cubic-bezier(.22,1,.36,1);min-width:220px;text-align:center;}
@keyframes kpI{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.kpt{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);}
.kpw{font-size:11px;color:rgba(255,255,255,.18);animation:bl 1.4s ease-in-out infinite;}
@keyframes bl{0%,100%{opacity:.18;}50%{opacity:.5;}}
.kpp{background:#0e0e1e;border:1px solid rgba(255,255,255,.14);border-bottom:3px solid rgba(255,255,255,.2);border-radius:5px;padding:6px 20px;font-size:18px;font-weight:700;letter-spacing:1.5px;color:var(--accent);font-family:'Rajdhani',sans-serif;box-shadow:0 0 20px var(--ad);min-width:60px;animation:pI .2s cubic-bezier(.22,1,.36,1);}
@keyframes pI{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.kpc{font-size:9.5px;color:rgba(255,255,255,.22);}.kpc span{color:var(--accent);font-weight:600;}
#kbpo{position:fixed;inset:0;z-index:9997;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:48px;pointer-events:none;}
#kbpo.vis{display:flex;}
</style>

  s('Settings',[
    s('Menu',[vl('Menu Hotkey','F4',['F1','F2','F3','F4','F5','F6','F7','F8','Insert','Delete','Home']),b('Reset Menu'),vl('Background','Default',['Default','Dark','Darker','Light'])]),
    s('Banner',[vl('Theme','Default',['Default','Grey','Yellow','Blue']),vl('Banner','Banner 1',['Banner 1','Banner 2','None'])]),
    s('Config',[b('Save Config'),b('Load Config #1'),b('Load Config #2'),b('Load Config #3')]),
  ]),
]};

const ONLINE_TABS={
  Safe:[sp('Teleport'),b('Spectate'),b('Local Teleport'),b('Teleport To'),b('Friend'),b('Teleport to Void'),b('Bring'),b('Copy Outfit'),sp('Actions'),b('Smash'),b('Silent Kill'),b('Explode'),b('Massacre'),b('Cage Player'),b('Attack'),b('Launch'),b('Box'),b('Freeze'),b('Stuck'),b('Random Ragdoll')],
  Risk:[b('Kill Player'),b('Silent Kill'),b('Killer Clown Attack'),b('UFO Attack'),b('Asteroid Attack'),b('Crash in Vehicle'),b('Spawn Admins'),b('Spawn Attacker'),b('Air Stuck'),b('Stuck Teleport'),b('Taze Loop'),b('Sound Spammer')],
  Vehicle:[b('Steal Vehicle'),b('Kick Driver'),b('Kick Driver #2'),b('Delete Vehicle'),b('Freeze Vehicle'),b('Glitch Vehicle'),b('TP to Void'),b('NPC Vehicle Hijack'),b('Launch Vehicle'),b('Break Vehicle')],
};
const OTN=['Safe','Risk','Vehicle'];

let stack=[{menu:MAIN,idx:0}];
let toggleState={};
let selectedPlrs=new Set();
let keybinds={};
let menuVisible=false;
let onlineMode=false,onlineTab=-1,onlineItemIdx=0;
let ONLINE_PLAYERS=[];
let kpState='waiting',kpPending=null,menuHotkey=null;
let kbMode=false,kbPending=null;
const KB_SKIP=new Set(['Shift','Control','Alt','Meta','CapsLock','Unidentified']);

function cur(){return stack[stack.length-1];}
function visItems(){return cur().menu.items.filter(i=>i.type!=='sep');}
function makeKey(item){return stack.map(s=>s.menu.label).join('||')+'||'+item.name;}
function cycleVal(it,d){const ci=it.actions.indexOf(it.val);it.val=it.actions[(ci+d+it.actions.length)%it.actions.length];}
function sstp(i){return(i.max-i.min)<=2?0.1:1;}
function spct(i){return((i.val-i.min)/(i.max-i.min))*100;}
function sfmt(i){return parseFloat(i.val).toFixed(sstp(i)<1?1:0);}
function adjSl(it,d){const s=sstp(it);it.val=Math.min(it.max,Math.max(it.min,parseFloat((it.val+d*s).toFixed(10))));}

function notify(title,msg){
  const c=document.getElementById('nc');
  while(c.children.length>=3)c.firstChild.remove();
  const nd=document.createElement('div');nd.className='notify';
  nd.innerHTML=`<div class="notify-header"><i class="fa-solid fa-bell"></i> ${title}</div><div class="notify-msg">${msg}</div><div class="notify-bar"></div>`;
  c.appendChild(nd);
  const bar=nd.querySelector('.notify-bar');
  setTimeout(()=>{bar.style.transition='width 3s linear';bar.style.width='0%';},10);
  setTimeout(()=>{nd.style.animation='nIn .3s reverse forwards';setTimeout(()=>nd.remove(),300);},3000);
}

function applyTheme(nm){
  document.body.className=nm==='Grey'?'t-grey':nm==='Yellow'?'t-yellow':nm==='Blue'?'t-blue':'';
}

function renderOnline(){
  document.getElementById('otabs').classList.add('vis');
  document.getElementById('otabs').querySelectorAll('.ot').forEach(ot=>ot.classList.toggle('act',parseInt(ot.dataset.tab)===onlineTab));
  const isL=onlineTab===-1;
  let html='';
  if(isL){
    document.getElementById('bc').textContent='Online — Players';
    if(!ONLINE_PLAYERS.length)html='<div style="padding:16px;text-align:center;font-size:11px;color:rgba(255,255,255,0.2)">Keine Spieler</div>';
    else ONLINE_PLAYERS.forEach((p,i)=>{
      const sel=i===onlineItemIdx,chk=selectedPlrs.has(p.id);
      const ms=p.me?'style="color:var(--accent);font-weight:600"':'';
      const mt=p.me?' <span style="font-size:9px;color:var(--accent)">(ich)</span>':'';
      html+=`<div class="item${sel?' sel':''}" data-i="${i}"><span class="in" ${ms}>[${p.id}] ${p.name}${mt}</span><div class="pc${chk?' chk':''}"></div></div>`;
    });
  }else{
    const tn=OTN[onlineTab];
    document.getElementById('bc').textContent='Online — '+tn;
    const items=ONLINE_TABS[tn];let vi=0;
    items.forEach(item=>{
      if(item.type==='sep'){html+=`<div class="sep">${item.label}</div>`;return;}
      const mi=vi++;const sel=mi===onlineItemIdx;
      const k='online||'+tn+'||'+item.name;const on=toggleState[k]||false;
      let r=item.type==='toggle'?`<div class="tgl${on?' on':''}"></div>`:FP;
      html+=`<div class="item${sel?' sel':''}" data-i="${mi}"><span class="in">${item.name}</span>${r}</div>`;
    });
  }
  document.getElementById('cnt').innerHTML=html;
  document.querySelector('.item.sel')?.scrollIntoView({block:'nearest'});
  document.getElementById('fct').textContent=isL?`${selectedPlrs.size} sel`:OTN[onlineTab];
}

function render(){
  if(!menuVisible)return;
  if(onlineMode){renderOnline();return;}
  document.getElementById('otabs').classList.remove('vis');
  const vis=visItems();const idx=cur().idx;
  document.getElementById('bc').textContent=stack.map(s=>s.menu.label).join(' › ');
  let html='';
  cur().menu.items.forEach(item=>{
    if(item.type==='sep'){html+=`<div class="sep">${item.label}</div>`;return;}
    const mi=vis.indexOf(item);const sel=mi===idx;
    const k=makeKey(item);const on=toggleState[k]||false;
    let r='';
    if(item.type==='toggle')r=`<div class="tgl${on?' on':''}"></div>`;
    else if(item.type==='slider'){const p=spct(item),d=sfmt(item);r=`<div class="srow"><span class="sv">${d}</span><div class="str"><div class="sf" style="width:${p}%"></div><div class="sth" style="left:${p}%"></div></div></div>`;}
    else if(item.type==='value')r=item.actions?`<span class="iv"><span class="ca">‹ </span>${item.val}<span class="ca"> ›</span></span>`:`<span class="iv">${item.val}</span>`;
    else if(item.type==='sub'||item.type==='online')r=`<span class="ar">»</span>`;
    else if(item.type==='button')r=FP;
    html+=`<div class="item${sel?' sel':''}" data-i="${mi}"><span class="in">${item.name}</span>${r}</div>`;
  });
  document.getElementById('cnt').innerHTML=html;
  document.getElementById('fct').textContent=`${Math.min(idx+1,vis.length)}/${vis.length}`;
  document.querySelector('.item.sel')?.scrollIntoView({block:'nearest'});
}

function renderKBList(){
  const el=document.getElementById('kl-items');if(!el)return;
  const e=Object.entries(keybinds);
  if(!e.length){el.innerHTML='<div style="padding:12px 10px;font-size:9px;color:rgba(255,255,255,.15);text-align:center">Leer — F6 auf Item</div>';return;}
  el.innerHTML=e.map(([nm,key])=>{
    const mk=Object.keys(toggleState).find(k=>k.endsWith('||'+nm));
    const isT=mk!==undefined;const on=isT&&toggleState[mk];
    const st=isT?(on?'<span class="kon">ON</span>':'<span class="kof">OFF</span>'):'';
    return`<div class="ki"><span class="kin">${nm}</span><div class="kir">${st}<span class="kk">${key}</span></div></div>`;
  }).join('');
}

function activate(item,dir){
  if(!item)return;
  const k=makeKey(item);
  if(item.type==='toggle'){
    toggleState[k]=!toggleState[k];const on=toggleState[k];
    if(item.name==='Spectator List'){/* handled by Lua */}
    if(item.name==='Keybind List')document.getElementById('kl').classList.toggle('open',on);
    if(item.name==='Show Watermark')document.getElementById('wm').classList.toggle('open',on);
    notify(item.name,on?'Enabled':'Disabled');
  }else if(item.type==='button'){
    if(item.name==='Reset Menu'){stack=[{menu:MAIN,idx:0}];toggleState={};render();notify('Menu','Reset');}
    else notify(item.name,'Triggered');
  }else if(item.type==='online'){onlineMode=true;onlineTab=-1;onlineItemIdx=0;}
  else if(item.type==='sub'){stack.push({menu:item.children,idx:0});}
  else if(item.type==='slider'){adjSl(item,dir);}
  else if(item.type==='value'&&item.actions){
    cycleVal(item,dir);
    if(item.name==='Theme')applyTheme(item.val);
    if(item.name==='Menu Hotkey'){menuHotkey=item.val;notify('Hotkey',item.val);}
  }
  render();
}

function activateOnlineItem(){
  if(onlineTab===-1){
    const p=ONLINE_PLAYERS[onlineItemIdx];
    if(p){selectedPlrs.clear();selectedPlrs.add(p.id);notify('Selected','['+p.id+'] '+p.name);}
  }else{
    const tn=OTN[onlineTab];
    const vis=ONLINE_TABS[tn].filter(i=>i.type!=='sep');
    const item=vis[onlineItemIdx];if(!item)return;
    const k='online||'+tn+'||'+item.name;
    if(item.type==='toggle'){toggleState[k]=!toggleState[k];notify(item.name,toggleState[k]?'Enabled':'Disabled');}
    else notify(item.name,'Triggered');
  }
  renderOnline();
}

function openMenu(){menuVisible=true;document.getElementById('wrapper').style.display='';render();}
function closeMenu(){menuVisible=false;document.getElementById('wrapper').style.display='none';stack=[{menu:MAIN,idx:0}];onlineMode=false;}

function kpShowKey(key){
  kpPending=key;
  const box=document.querySelector('#kpo .kpb');
  const old=box.querySelector('.kpp');if(old)old.remove();
  const pill=document.createElement('span');pill.className='kpp';pill.textContent=key;
  box.insertBefore(pill,document.getElementById('kpcf'));
  document.getElementById('kpw').style.display='none';
  document.getElementById('kpkd').textContent=key;
  document.getElementById('kpcf').style.display='';
  kpState='confirm';
}
function kpConfirm(){
  menuHotkey=kpPending;kpState='done';
  document.getElementById('kpo').classList.add('hidden');
  notify('Menu Key',kpPending+' öffnet/schließt das Menu');
}

function openKbPicker(item){
  kbMode=true;kbPending={item,key:null};
  document.getElementById('kbpn').textContent=item.name;
  document.getElementById('kbpw').style.display='';
  document.getElementById('kbpcf').style.display='none';
  const old=document.getElementById('kbpb').querySelector('.kpp');if(old)old.remove();
  document.getElementById('kbpo').classList.add('vis');
}
function closeKbPicker(){kbMode=false;kbPending=null;document.getElementById('kbpo').classList.remove('vis');}
function confirmKbPicker(){
  if(!kbPending?.key)return;
  keybinds[kbPending.item.name]=kbPending.key;
  closeKbPicker();renderKBList();
  notify('Keybind',kbPending.item.name+' → '+kbPending.key);
}

function handleKey(key){
  if(kpState!=='done'){
    if(kpState==='confirm'){
      if(key==='Enter'){kpConfirm();return;}
      if(key==='Backspace'){kpState='waiting';kpPending=null;const old=document.querySelector('#kpo .kpb .kpp');if(old)old.remove();document.getElementById('kpw').style.display='';document.getElementById('kpcf').style.display='none';return;}
      kpShowKey(key);return;
    }
    if(key==='Enter')return;
    kpShowKey(key);return;
  }
  if(kbMode){
    if(key==='Escape'){closeKbPicker();return;}
    if(key==='Backspace'){if(kbPending?.item)delete keybinds[kbPending.item.name];closeKbPicker();renderKBList();return;}
    if(key==='Enter'){confirmKbPicker();return;}
    if(KB_SKIP.has(key))return;
    kbPending.key=key;
    const box=document.getElementById('kbpb');
    const old=box.querySelector('.kpp');if(old)old.remove();
    const pill=document.createElement('span');pill.className='kpp';pill.textContent=key;
    box.insertBefore(pill,document.getElementById('kbpcf'));
    document.getElementById('kbpw').style.display='none';
    document.getElementById('kbpkd').textContent=key;
    document.getElementById('kbpcf').style.display='';
    return;
  }
  if(menuHotkey&&key===menuHotkey){if(menuVisible)closeMenu();else openMenu();return;}
  if(!menuVisible){
    for(const[nm,k] of Object.entries(keybinds)){
      if(key!==k)continue;
      const find=m=>{for(const it of m.items){if(it.name===nm)return it;if(it.type==='sub'&&it.children){const f=find(it.children);if(f)return f;}}return null;};
      const it=find(MAIN);if(!it)continue;
      const mk=Object.keys(toggleState).find(k2=>k2.endsWith('||'+nm))||('Main Menu||'+nm);
      if(it.type==='toggle'){
        toggleState[mk]=!toggleState[mk];
        if(it.name==='Keybind List')document.getElementById('kl').classList.toggle('open',toggleState[mk]);
        renderKBList();notify(nm,toggleState[mk]?'Enabled':'Disabled');
      }else notify(nm,'Triggered');
      return;
    }
    return;
  }
  if(onlineMode){
    const isL=onlineTab===-1;
    const vis=isL?ONLINE_PLAYERS:ONLINE_TABS[OTN[onlineTab]].filter(i=>i.type!=='sep');
    if(key==='ArrowDown'){onlineItemIdx=Math.min(onlineItemIdx+1,vis.length-1);renderOnline();}
    else if(key==='ArrowUp'){onlineItemIdx=Math.max(onlineItemIdx-1,0);renderOnline();}
    else if(key==='Enter'||key==='ArrowRight'){activateOnlineItem();}
    else if(key==='ArrowLeft'||key==='Backspace'){if(!isL){onlineTab=-1;onlineItemIdx=0;renderOnline();}else{onlineMode=false;render();}}
    else if(key==='TabRight'){onlineTab=(onlineTab+1)%3;if(onlineTab<0)onlineTab=0;onlineItemIdx=0;renderOnline();}
    else if(key==='TabLeft'){onlineTab=(onlineTab-1+3)%3;onlineItemIdx=0;renderOnline();}
    return;
  }
  const vis=visItems();const st=cur();const it=vis[st.idx];
  if(key==='F6'&&it&&it.type!=='sep'&&it.type!=='sub'&&it.type!=='online'){openKbPicker(it);return;}
  if(key==='ArrowDown'){cur().idx=Math.min(st.idx+1,vis.length-1);render();}
  else if(key==='ArrowUp'){cur().idx=Math.max(st.idx-1,0);render();}
  else if(key==='Enter'||key==='ArrowRight'){activate(it,1);}
  else if(key==='ArrowLeft'){
    if(it?.type==='slider'){adjSl(it,-1);render();}
    else if(it?.type==='value'&&it.actions){cycleVal(it,-1);if(it.name==='Theme')applyTheme(it.val);if(it.name==='Menu Hotkey'){menuHotkey=it.val;notify('Hotkey',it.val);}render();}
    else if(stack.length>1){stack.pop();render();}
  }
  else if(key==='Backspace'){if(stack.length>1){stack.pop();render();}else closeMenu();}
}

window.addEventListener('message',ev=>{
  const d=ev.data;if(!d?.type)return;
  if(d.type==='control'){handleKey(d.key);return;}
  if(d.type==='notify'){notify(d.title||'',d.msg||'');return;}
  if(d.type==='updatePlayers'){ONLINE_PLAYERS=d.players||[];if(onlineMode&&onlineTab===-1)renderOnline();return;}
});

setInterval(()=>{const el=document.getElementById('wmt');if(!el)return;const n=new Date();el.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');},1000);
</script>
</body>
